<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Solo Etude - Grand Score & TAB</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const standardSongs = [
      {
        title: "Autumn Leaves",
        measures: 32,
        chords: [
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Am7b5", "D7", "Gm7", "Gm7", "Cm7", "F7", "Bbmaj7", "Ebmaj7",
          "Am7b5", "D7", "Gm7 C7", "Fm7 Bb7", "Ebmaj7", "Am7b5 D7", "Gm7", "Gm7"
        ]
      },
      {
        title: "All The Things You Are",
        measures: 36,
        chords: [
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "G7", "Cmaj7", "Cmaj7",
          "Cm7", "Fm7", "Bb7", "Ebmaj7", "Abmaj7", "D7", "Gmaj7", "Gmaj7",
          "Am7", "D7", "Gmaj7", "Gmaj7", "F#m7b5", "B7", "Emaj7", "C7#5",
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "Dbm7", "Cm7", "Bdim7",
          "Bbm7", "Eb7", "Abmaj7", "Abmaj7"
        ]
      },
      {
        title: "Donna Lee",
        measures: 32,
        chords: [
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Bbm7", "Bb7", "Bb7",
          "Bbm7", "Eb7", "Abmaj7", "F7", "Bbm7", "C7", "Fm7", "C7",
          "Fm7", "Fm7", "C7", "C7", "Fm7", "Fm7", "Eb7", "Eb7",
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Edim7", "Abmaj7 F7", "Bbm7 Eb7"
        ]
      },
      {
        title: "Stella by Starlight",
        measures: 32,
        chords: [
          "Em7b5", "A7", "Cm7", "F7", "Fm7", "Bb7", "Ebmaj7", "Ebmaj7",
          "Ab7", "Ab7", "Bbmaj7", "Bbmaj7", "Em7b5", "A7", "Dm7", "Dm7",
          "Bbm7", "Eb7", "Fmaj7", "Fmaj7", "Em7b5", "A7", "Am7b5", "D7",
          "G7", "G7", "Cm7", "Cm7", "Ab7", "Ab7", "Bbmaj7", "Bbmaj7"
        ]
      },
      {
        title: "There Will Never Be Another You",
        measures: 32,
        chords: [
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Abmaj7", "Ebmaj7", "Ebmaj7", "Fm7", "Fm7", "Bb7", "Bb7",
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Db7", "Ebmaj7 C7", "Fm7 Bb7", "Ebmaj7", "Fm7", "Bb7", "Bb7"
        ]
      },
      {
        title: "Giant Steps",
        measures: 16,
        chords: [
          "Bmaj7 D7", "Gmaj7 Bb7", "Ebmaj7", "Am7 D7",
          "Gmaj7 Bb7", "Ebmaj7 F#7", "Bmaj7", "Fm7 Bb7",
          "Ebmaj7", "Am7 D7", "Gmaj7", "C#m7 F#7",
          "Bmaj7", "Fm7 Bb7", "Ebmaj7", "C#m7 F#7"
        ]
      }
    ];

    const PITCH_OFFSETS = {
      'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
      'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8,
      'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
    };

    function App() {
      const [measureCount, setMeasureCount] = useState(32);
      const [bpm, setBpm] = useState(130);
      const [chords, setChords] = useState(Array(64).fill(""));
      const [currentSongTitle, setCurrentSongTitle] = useState("Autumn Leaves");
      const [v7Approach, setV7Approach] = useState("altered"); // chordtone, altered, condim
      const [tabMode, setTabMode] = useState("guitar"); // guitar, bass, none
      const [degreeDisplayMode, setDegreeDisplayMode] = useState("badge"); // badge, text, noteColor
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      const [isPlaying, setIsPlaying] = useState(false);
      const [activeNoteId, setActiveNoteId] = useState(null);
      const [scoreData, setScoreData] = useState([]);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const audioCtxRef = useRef(null);
      const timerRef = useRef(null);

      useEffect(() => {
        const song = standardSongs[0];
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSongTitle(song.title);
      }, []);

      useEffect(() => {
        if (chords[0] !== "") {
          generateSolo();
        }
      }, [chords, v7Approach]);

      // 度数解析（重なり防止の短縮表記：R, 3, 5, 7, b9, #9, #11, b13, appr 等）
      const getDegree = (midi, chordStr) => {
        if (!chordStr) return { shortLabel: "CT", type: "ct" };
        const match = chordStr.match(/^[A-G][#b]?/);
        const root = match ? match[0] : 'C';
        const rootMidi = PITCH_OFFSETS[root] || 0;
        const interval = (midi % 12 - rootMidi + 12) % 12;
        const type = chordStr.substring(root.length);

        const isMinor = type.includes('m') && !type.includes('maj');
        const isDim = type.includes('dim') || type.includes('m7b5');
        const isV7 = type.includes('7') && !isMinor && !type.includes('maj');

        if (interval === 0) return { shortLabel: "R", type: "ct" };
        if (interval === 4 && !isMinor) return { shortLabel: "3", type: "ct" };
        if (interval === 3 && isMinor) return { shortLabel: "♭3", type: "ct" };
        if (interval === 7 && !isDim) return { shortLabel: "5", type: "ct" };
        if (interval === 6 && isDim) return { shortLabel: "♭5", type: "ct" };
        if (interval === 10 && (isV7 || isMinor || isDim)) return { shortLabel: "7", type: "ct" };
        if (interval === 11 && !isV7 && !isMinor) return { shortLabel: "△7", type: "ct" };

        if (isV7) {
          if (interval === 1) return { shortLabel: "♭9", type: "alt" };
          if (interval === 3) return { shortLabel: "♯9", type: "alt" };
          if (interval === 6) return { shortLabel: "♯11", type: "alt" };
          if (interval === 8) return { shortLabel: "♭13", type: "alt" };
          if (interval === 2) return { shortLabel: "9", type: "tension" };
          if (interval === 9) return { shortLabel: "13", type: "tension" };
        } else {
          if (interval === 2) return { shortLabel: "9", type: "tension" };
          if (interval === 5) return { shortLabel: "11", type: "tension" };
          if (interval === 9) return { shortLabel: "13", type: "tension" };
        }

        return { shortLabel: "•", type: "appr" }; // 経過音・アプローチはシンプルに「•」で表現し衝突を皆無に
      };

      // TABポジション算出（ギター: 6弦, ベース: 4弦 8vb）
      const getTabPosition = (midi, isBass) => {
        if (!midi) return null;
        if (isBass) {
          const target = midi - 12; // 実音ピッチを変えずにTABのみ1オクターブ下 (8vb)
          const bassTunings = [43, 38, 33, 28]; // G2, D2, A1, E1
          for (let s = 0; s < bassTunings.length; s++) {
            const fret = target - bassTunings[s];
            if (fret >= 0 && fret <= 18) {
              return { string: s + 1, fret };
            }
          }
          return { string: 1, fret: Math.max(0, target - 43) };
        } else {
          const guitarTunings = [64, 59, 55, 50, 45, 40];
          let best = null;
          let minDiff = 999;
          for (let s = 0; s < guitarTunings.length; s++) {
            const fret = midi - guitarTunings[s];
            if (fret >= 0 && fret <= 21) {
              const diff = Math.abs(fret - 7);
              if (diff < minDiff) {
                minDiff = diff;
                best = { string: s + 1, fret };
              }
            }
          }
          return best || { string: 1, fret: 12 };
        }
      };

      // 五線譜の音高Y座標計算（C4 = 60, D4, E4, F4... 幹音ステップ）
      const getNoteStaffY = (midi) => {
        const staffBaseY = 65; // 五線譜第1線(E4)付近
        // 半音ではなく全音階ステップ換算
        const midiStepMap = {
          50: 0, 51: 0, 52: 1, 53: 2, 54: 2, 55: 3, 56: 3, 57: 4, 58: 4, 59: 5,
          60: 6, 61: 6, 62: 7, 63: 7, 64: 8, 65: 9, 66: 9, 67: 10, 68: 10, 69: 11, 70: 11, 71: 12,
          72: 13, 73: 13, 74: 14, 75: 14, 76: 15, 77: 16, 78: 16, 79: 17, 80: 17, 81: 18
        };
        const step = midiStepMap[midi] !== undefined ? midiStepMap[midi] : 6;
        // 1ステップ = 4.5px (第1線E4 = step 8)
        return staffBaseY - (step - 8) * 4.5;
      };

      // フレーズ生成（2オクターブ跳躍・ビバップリック・3連符）
      const generateSolo = () => {
        let measures = [];
        let noteIdCounter = 0;
        let curMidi = 62; // D4

        const MIN_NOTE = 50; // D3
        const MAX_NOTE = 81; // A5

        for (let m = 0; m < measureCount; m++) {
          const chordStr = chords[m] || "Cmaj7";
          const chordList = chordStr.split(/\s+/).filter(c => c.length > 0);
          const firstChord = chordList[0] || "Cmaj7";
          const match = firstChord.match(/^[A-G][#b]?/);
          const rootMidi = match ? (PITCH_OFFSETS[match[0]] || 0) : 0;
          const isV7 = firstChord.includes('7') && !firstChord.includes('maj') && !firstChord.includes('m');

          let notes = [];
          const pattern = m % 4;

          if (pattern === 0) {
            // 【急上昇アルペジオ】低域から2オクターブ駆け上がり
            let p = 50 + rootMidi;
            while (p < 52) p += 12;
            while (p > 60) p -= 12;

            for (let i = 0; i < 6; i++) {
              p += (i % 2 === 0 ? 4 : 3);
              if (p > MAX_NOTE) p -= 12;
              notes.push({ midi: p, dur: '8th', isTrip: false, ...getDegree(p, firstChord), id: noteIdCounter++ });
            }
            p -= 2;
            notes.push({ midi: p, dur: '8th', isTrip: false, ...getDegree(p, firstChord), id: noteIdCounter++ });
            p -= 1;
            notes.push({ midi: p, dur: '8th', isTrip: false, ...getDegree(p, firstChord), id: noteIdCounter++ });
            curMidi = p;

          } else if (pattern === 1) {
            // 【ビバップ・ターン3連符 & 下降スケール】
            const target = curMidi;
            notes.push({ midi: target + 1, dur: 'trip', isTrip: true, ...getDegree(target + 1, firstChord), id: noteIdCounter++ });
            notes.push({ midi: target, dur: 'trip', isTrip: true, ...getDegree(target, firstChord), id: noteIdCounter++ });
            notes.push({ midi: target - 1, dur: 'trip', isTrip: true, ...getDegree(target - 1, firstChord), id: noteIdCounter++ });

            let p = target - 1;
            for (let i = 0; i < 5; i++) {
              p -= (i % 2 === 0 ? 2 : 1);
              if (p < MIN_NOTE) p += 12;
              notes.push({ midi: p, dur: '8th', isTrip: false, ...getDegree(p, firstChord), id: noteIdCounter++ });
            }
            curMidi = p;

          } else if (pattern === 2) {
            // 【V7オルタード／コンディミ解決 & エンクロージャー】
            if (isV7) {
              const tension = v7Approach === 'altered' ? (60 + rootMidi + 1) : (60 + rootMidi + 3);
              notes.push({ midi: tension, dur: '8th', isTrip: false, ...getDegree(tension, firstChord), id: noteIdCounter++ });
              notes.push({ midi: tension - 1, dur: '8th', isTrip: false, ...getDegree(tension - 1, firstChord), id: noteIdCounter++ });

              const third = 60 + rootMidi + 4;
              notes.push({ midi: third + 1, dur: '8th', isTrip: false, ...getDegree(third + 1, firstChord), id: noteIdCounter++ });
              notes.push({ midi: third - 1, dur: '8th', isTrip: false, ...getDegree(third - 1, firstChord), id: noteIdCounter++ });
              notes.push({ midi: third, dur: 'quarter', isTrip: false, ...getDegree(third, firstChord), id: noteIdCounter++ });
              notes.push({ midi: null, dur: 'quarter', isTrip: false, shortLabel: "", type: "rest", id: noteIdCounter++ });
              curMidi = third;
            } else {
              let p = curMidi;
              notes.push({ midi: p, dur: 'quarter', isTrip: false, ...getDegree(p, firstChord), id: noteIdCounter++ });
              notes.push({ midi: p + 3, dur: 'trip', isTrip: true, ...getDegree(p + 3, firstChord), id: noteIdCounter++ });
              notes.push({ midi: p + 7, dur: 'trip', isTrip: true, ...getDegree(p + 7, firstChord), id: noteIdCounter++ });
              notes.push({ midi: p + 10, dur: 'trip', isTrip: true, ...getDegree(p + 10, firstChord), id: noteIdCounter++ });
              notes.push({ midi: p + 12, dur: 'quarter', isTrip: false, ...getDegree(p + 12, firstChord), id: noteIdCounter++ });
              notes.push({ midi: null, dur: '8th', isTrip: false, shortLabel: "", type: "rest", id: noteIdCounter++ });
              curMidi = p + 12;
            }

          } else {
            // 【ワイド跳躍 & 3連クロマチック】
            let jump = curMidi < 66 ? curMidi + 14 : curMidi - 14;
            if (jump > MAX_NOTE) jump -= 12;
            if (jump < MIN_NOTE) jump += 12;

            notes.push({ midi: curMidi, dur: '8th', isTrip: false, ...getDegree(curMidi, firstChord), id: noteIdCounter++ });
            notes.push({ midi: jump, dur: '8th', isTrip: false, ...getDegree(jump, firstChord), id: noteIdCounter++ });

            notes.push({ midi: jump - 1, dur: 'trip', isTrip: true, ...getDegree(jump - 1, firstChord), id: noteIdCounter++ });
            notes.push({ midi: jump - 2, dur: 'trip', isTrip: true, ...getDegree(jump - 2, firstChord), id: noteIdCounter++ });
            notes.push({ midi: jump - 3, dur: 'trip', isTrip: true, ...getDegree(jump - 3, firstChord), id: noteIdCounter++ });

            notes.push({ midi: jump - 4, dur: 'quarter', isTrip: false, ...getDegree(jump - 4, firstChord), id: noteIdCounter++ });
            notes.push({ midi: null, dur: '8th', isTrip: false, shortLabel: "", type: "rest", id: noteIdCounter++ });
            curMidi = jump - 4;
          }

          measures.push({ measureNumber: m + 1, chord: chordStr, notes });
        }

        setScoreData(measures);
      };

      // 再生制御
      const stopPlay = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        setIsPlaying(false);
        setActiveNoteId(null);
      };

      const startPlay = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        const ctx = audioCtxRef.current;
        if (ctx.state === 'suspended') ctx.resume();

        setIsPlaying(true);
        const beatSec = 60 / bpm;
        const swingLong = beatSec * 0.62;
        const swingShort = beatSec * 0.38;

        let flatNotes = [];
        scoreData.forEach(m => m.notes.forEach(n => flatNotes.push(n)));

        let idx = 0;
        const playNext = () => {
          if (idx >= flatNotes.length) {
            stopPlay();
            return;
          }
          const n = flatNotes[idx];
          setActiveNoteId(n.id);

          if (!isBackingOnly && n.midi) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            const freq = 440 * Math.pow(2, (n.midi - 69) / 12);
            osc.frequency.setValueAtTime(freq, ctx.currentTime);

            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            const playDur = n.dur === 'quarter' ? beatSec * 0.9 : beatSec * 0.45;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + playDur);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + playDur + 0.05);
          }

          idx++;
          let duration = beatSec * 0.5 * 1000;
          if (n.isTrip) duration = (beatSec / 3) * 1000;
          else if (n.dur === 'quarter') duration = beatSec * 1000;
          else duration = (idx % 2 === 1 ? swingLong : swingShort) * 1000;

          timerRef.current = setTimeout(playNext, duration);
        };

        playNext();
      };

      const selectSong = (song) => {
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSongTitle(song.title);
        setIsModalOpen(false);
      };

      return (
        <div className="min-h-screen bg-slate-50 print:bg-white text-slate-800 p-4 md:p-8 print:p-0">
          <div className="max-w-6xl mx-auto space-y-6 print:space-y-0">
            
            {/* ヘッダー */}
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4 print:hidden">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-blue-600 text-white rounded-xl shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">Jazz Solo & TAB Etude</h1>
                  <p className="text-xs text-slate-500">五線譜＋タブ譜上下併記・度数バッジ付きエチュード生成ツール</p>
                </div>
              </div>

              {/* 併記TABの選択 */}
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500">TAB併記:</span>
                <div className="flex bg-slate-200/80 p-1 rounded-xl gap-1 border border-slate-300">
                  <button
                    onClick={() => setTabMode('guitar')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabMode === 'guitar' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ギターTAB併記
                  </button>
                  <button
                    onClick={() => setTabMode('bass')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabMode === 'bass' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ベースTAB併記 (8vb)
                  </button>
                  <button
                    onClick={() => setTabMode('none')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabMode === 'none' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    五線譜のみ
                  </button>
                </div>
              </div>
            </header>

            {/* コントロールバー */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 print:hidden">
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                  V7 (ドミナント) アプローチ
                </label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button
                    onClick={() => setV7Approach('chordtone')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'chordtone' ? 'bg-amber-50 border-amber-500 text-amber-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    コードトーン
                  </button>
                  <button
                    onClick={() => setV7Approach('altered')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'altered' ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    オルタード
                  </button>
                  <button
                    onClick={() => setV7Approach('condim')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'condim' ? 'bg-indigo-50 border-indigo-500 text-indigo-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    コンディミ
                  </button>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-bold text-slate-600 uppercase tracking-wider">テンポ: {bpm} BPM</label>
                  <span className="text-xs text-slate-500 font-medium">{measureCount} 小節</span>
                </div>
                <input 
                  type="range" min="80" max="220" step="5" value={bpm} 
                  onChange={(e) => setBpm(Number(e.target.value))} 
                  className="w-full accent-blue-600 h-2 bg-slate-100 rounded-lg cursor-pointer"
                />
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg border border-slate-200 transition"
                >
                  スタンダード曲から選択 ({currentSongTitle || "カスタム"})
                </button>
              </div>

              <div className="flex flex-col justify-end">
                <button
                  onClick={generateSolo}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition active:scale-[0.98] flex items-center justify-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path></svg>
                  エチュードを再生成
                </button>
              </div>
            </div>

            {/* 凡例 & プレイヤーバー */}
            <div className="flex flex-wrap items-center justify-between gap-3 bg-white px-5 py-3 rounded-xl border border-slate-200 text-xs font-semibold print:hidden">
              <div className="flex items-center gap-5">
                <span className="text-slate-500">度数バッジ:</span>
                <span className="flex items-center gap-1.5 text-amber-700">
                  <span className="px-1.5 py-0.5 rounded bg-amber-100 text-[10px] font-bold border border-amber-300">R / 3 / 5 / 7</span> コードトーン
                </span>
                <span className="flex items-center gap-1.5 text-blue-700">
                  <span className="px-1.5 py-0.5 rounded bg-blue-100 text-[10px] font-bold border border-blue-300">♭9 / ♯9 / 13</span> テンション/オルタード
                </span>
                <span className="flex items-center gap-1.5 text-slate-600">
                  <span className="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] font-bold border border-slate-300">•</span> アプローチ/経過音
                </span>
              </div>
              <div className="flex items-center gap-3">
                <label className="flex items-center gap-1.5 cursor-pointer text-slate-700">
                  <input
                    type="checkbox"
                    checked={isBackingOnly}
                    onChange={(e) => setIsBackingOnly(e.target.checked)}
                    className="w-4 h-4 text-blue-600 rounded"
                  />
                  <span>伴奏のみ</span>
                </label>
                <button
                  onClick={isPlaying ? stopPlay : startPlay}
                  className={`px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${isPlaying ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-slate-900 hover:bg-slate-800 text-white'}`}
                >
                  {isPlaying ? '停止' : '再生 / 練習'}
                </button>
              </div>
            </div>

            {/* 楽譜 & TAB併記エンジン (HTML5 SVG) */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 overflow-x-auto print:border-none print:shadow-none custom-scrollbar">
              <div className="min-w-[760px] space-y-10">
                {/* 1行あたり2小節でゆったり描画し、度数文字の重なりを完全解消 */}
                {Array.from({ length: Math.ceil(scoreData.length / 2) }).map((_, systemIdx) => {
                  const systemMeasures = scoreData.slice(systemIdx * 2, systemIdx * 2 + 2);
                  const isBass = tabMode === 'bass';
                  const hasTab = tabMode !== 'none';
                  const tabLines = isBass ? 4 : 6;
                  const tabLineHeight = 13;

                  // 垂直レイアウト
                  const trebleTop = 50;     // 五線譜の開始位置
                  const trebleBottom = trebleTop + 4 * 9; // 36px幅
                  const tabTop = hasTab ? trebleBottom + 45 : 0; // 五線譜の下にTABを配置
                  const totalHeight = hasTab ? tabTop + (tabLines - 1) * tabLineHeight + 25 : trebleBottom + 30;

                  return (
                    <div key={systemIdx} className="relative bg-white border-b border-slate-100 pb-8">
                      <svg width="100%" height={totalHeight} viewBox={`0 0 860 ${totalHeight}`} className="overflow-visible">
                        
                        {/* === 五線譜の5本線 === */}
                        {[0, 1, 2, 3, 4].map(l => (
                          <line
                            key={`staff-${l}`}
                            x1="30"
                            y1={trebleTop + l * 9}
                            x2="840"
                            y2={trebleTop + l * 9}
                            stroke="#cbd5e1"
                            strokeWidth="1.2"
                          />
                        ))}

                        {/* ト音記号 */}
                        <text x="35" y={trebleTop + 28} fontSize="34" fill="#334155" fontFamily="serif" className="select-none">𝄞</text>

                        {/* === TAB譜の平行線（併記モード時） === */}
                        {hasTab && (
                          <g>
                            {Array.from({ length: tabLines }).map((_, l) => (
                              <line
                                key={`tab-${l}`}
                                x1="30"
                                y1={tabTop + l * tabLineHeight}
                                x2="840"
                                y2={tabTop + l * tabLineHeight}
                                stroke="#e2e8f0"
                                strokeWidth="1.2"
                              />
                            ))}
                            <g fill="#94a3b8" fontWeight="bold" fontSize="10" fontFamily="sans-serif">
                              <text x="35" y={tabTop + 14}>T</text>
                              <text x="35" y={tabTop + 26}>A</text>
                              <text x="35" y={tabTop + 38}>B</text>
                            </g>
                          </g>
                        )}

                        {/* システム全体の小節境界線 */}
                        {[30, 435, 840].map((x, idx) => (
                          <line
                            key={`bar-${idx}`}
                            x1={x}
                            y1={trebleTop}
                            x2={x}
                            y2={hasTab ? tabTop + (tabLines - 1) * tabLineHeight : trebleBottom}
                            stroke="#94a3b8"
                            strokeWidth={idx === 2 ? "2" : "1.2"}
                          />
                        ))}

                        {/* === 小節ごとの音符・TAB・度数バッジ描画 === */}
                        {systemMeasures.map((measure, mIdx) => {
                          const measureLeft = 30 + mIdx * 405;

                          return (
                            <g key={mIdx}>
                              {/* コードネーム */}
                              <text
                                x={measureLeft + 30}
                                y={26}
                                fontSize="16"
                                fontWeight="bold"
                                fill="#0f172a"
                                fontFamily="sans-serif"
                              >
                                {measure.chord}
                              </text>
                              {/* 小節番号 */}
                              <text
                                x={measureLeft + 395}
                                y={22}
                                fontSize="10"
                                fill="#94a3b8"
                                textAnchor="end"
                              >
                                m.{measure.measureNumber}
                              </text>

                              {/* 音符＆TAB数字 */}
                              {measure.notes.map((note, nIdx) => {
                                // 1小節あたり最大8音（ゆったり40px間隔）
                                const noteX = measureLeft + 45 + nIdx * 42;
                                const isHighlight = activeNoteId === note.id;

                                if (!note.midi) {
                                  // 休符
                                  return (
                                    <text key={nIdx} x={noteX} y={trebleTop + 22} fontSize="18" fill="#94a3b8">
                                      𝄽
                                    </text>
                                  );
                                }

                                const noteY = getNoteStaffY(note.midi);
                                const tabPos = getTabPosition(note.midi, isBass);
                                const tabY = hasTab ? tabTop + (tabPos.string - 1) * tabLineHeight : 0;

                                // 度数バッジのカラーリング
                                let badgeBg = "#f1f5f9";
                                let badgeBorder = "#cbd5e1";
                                let badgeText = "#475569";
                                if (note.type === 'ct') {
                                  badgeBg = "#fef3c7";
                                  badgeBorder = "#fde68a";
                                  badgeText = "#b45309";
                                } else if (note.type === 'alt' || note.type === 'tension') {
                                  badgeBg = "#dbeafe";
                                  badgeBorder = "#bfdbfe";
                                  badgeText = "#1d4ed8";
                                }

                                return (
                                  <g key={nIdx}>
                                    {/* 1. 度数バッジ（五線譜の上にゆったり配置、文字衝突ゼロ） */}
                                    {note.shortLabel && (
                                      <g transform={`translate(${noteX}, ${trebleTop - 20})`}>
                                        <rect
                                          x="-12"
                                          y="-8"
                                          width="24"
                                          height="16"
                                          rx="4"
                                          fill={badgeBg}
                                          stroke={badgeBorder}
                                          strokeWidth="1"
                                        />
                                        <text
                                          x="0"
                                          y="3.5"
                                          fontSize="10"
                                          fontWeight="bold"
                                          fill={badgeText}
                                          textAnchor="middle"
                                          className="select-none"
                                        >
                                          {note.shortLabel}
                                        </text>
                                      </g>
                                    )}

                                    {/* 3連符マーク */}
                                    {note.isTrip && (
                                      <text x={noteX} y={trebleTop - 2} fontSize="9" fill="#2563eb" textAnchor="middle" fontWeight="bold">
                                        3
                                      </text>
                                    )}

                                    {/* 2. 五線譜の音符本体（符頭・符尾） */}
                                    <g>
                                      {/* 加線（五線譜からはみ出る高音・低音） */}
                                      {noteY > trebleBottom && (
                                        <line x1={noteX - 7} y1={trebleBottom + 9} x2={noteX + 7} y2={trebleBottom + 9} stroke="#94a3b8" strokeWidth="1.2" />
                                      )}
                                      {noteY < trebleTop && (
                                        <line x1={noteX - 7} y1={trebleTop - 9} x2={noteX + 7} y2={trebleTop - 9} stroke="#94a3b8" strokeWidth="1.2" />
                                      )}

                                      {/* 符頭 */}
                                      <ellipse
                                        cx={noteX}
                                        cy={noteY}
                                        rx="4.8"
                                        ry="3.6"
                                        transform={`rotate(-20, ${noteX}, ${noteY})`}
                                        fill={isHighlight ? "#2563eb" : "#0f172a"}
                                      />
                                      {/* 符尾（上向きステム） */}
                                      <line
                                        x1={noteX + 4.2}
                                        y1={noteY}
                                        x2={noteX + 4.2}
                                        y2={noteY - 24}
                                        stroke={isHighlight ? "#2563eb" : "#0f172a"}
                                        strokeWidth="1.3"
                                      />
                                    </g>

                                    {/* 3. 真下に併記されるTAB譜（五線譜と縦位置が完全一致） */}
                                    {hasTab && tabPos && (
                                      <g>
                                        <rect
                                          x={noteX - 8}
                                          y={tabY - 7}
                                          width="16"
                                          height="14"
                                          fill={isHighlight ? "#2563eb" : "#ffffff"}
                                          rx="3"
                                        />
                                        <text
                                          x={noteX}
                                          y={tabY + 4}
                                          fontSize="12"
                                          fontWeight="bold"
                                          fill={isHighlight ? "#ffffff" : "#0f172a"}
                                          textAnchor="middle"
                                          className="select-none"
                                        >
                                          {tabPos.fret}
                                        </text>
                                      </g>
                                    )}
                                  </g>
                                );
                              })}
                            </g>
                          );
                        })}
                      </svg>
                    </div>
                  );
                })}
              </div>
            </div>

          </div>

          {/* スタンダード曲選択モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[80vh] overflow-hidden flex flex-col">
                <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 text-sm">スタンダード曲を選択</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="p-3 overflow-y-auto custom-scrollbar space-y-1.5">
                  {standardSongs.map((song, idx) => (
                    <button
                      key={idx}
                      onClick={() => selectSong(song)}
                      className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-blue-50 hover:text-blue-700 transition flex justify-between items-center group text-xs font-semibold text-slate-700"
                    >
                      <span>{song.title}</span>
                      <span className="text-[11px] px-2 py-0.5 bg-slate-100 group-hover:bg-blue-100 text-slate-500 group-hover:text-blue-700 rounded-md">
                        {song.measures} 小節
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Giants Lick & Chord Tone Etude Generator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-audio.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>

  <style>
    .abcjs-css-warning { display: none !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .abcjs-note { fill: #0f172a; }
    .abcjs-staff { stroke: #64748b; }
    .abcjs-highlight { fill: #2563eb !important; stroke: #2563eb !important; }
    .abcjs-tempo { display: none !important; }

    /* コードネームと度数（歌詞行 w:）のスタイル */
    .abcjs-chord { font-size: 15px !important; font-weight: 800 !important; fill: #0f172a !important; }
    .abcjs-lyric { font-size: 11px !important; font-weight: 700 !important; fill: #b45309 !important; font-family: sans-serif !important; }

    /* TAB譜スタイル */
    .abcjs-tablature line { stroke: #cbd5e1; }
    .abcjs-tablature text { fill: #0f172a; font-weight: bold; font-family: monospace; font-size: 13px; }
    
    #paper { padding-bottom: 20px; }
    #paper svg { 
      overflow: visible !important; 
      margin-bottom: 30px !important; 
      width: 100% !important;
      height: auto !important;
    }

    .abcjs-inline-audio { margin: 0; padding: 10px; display: flex; align-items: center; gap: 8px; justify-content: center; }
    .abcjs-inline-audio .abcjs-btn {
       background-color: #f1f5f9 !important;
       border: 1px solid #cbd5e1 !important;
       border-radius: 8px !important;
       color: #334155 !important;
       width: 36px !important;
       height: 36px !important;
       cursor: pointer;
       display: inline-flex !important;
       align-items: center;
       justify-content: center;
       margin: 0 4px;
       padding: 0 !important;
       transition: all 0.15s ease-in-out !important;
    }
    .abcjs-inline-audio .abcjs-btn:hover { background-color: #e2e8f0 !important; }
    .abcjs-inline-audio .abcjs-btn svg { width: 18px !important; height: 18px !important; fill: #334155 !important; }

    /* ループ再生ボタンON時の明確な色付けハイライト */
    .abcjs-inline-audio .abcjs-btn.abcjs-pushed {
       background-color: #2563eb !important;
       border-color: #1d4ed8 !important;
       color: #ffffff !important;
       box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25) !important;
    }
    .abcjs-inline-audio .abcjs-btn.abcjs-pushed svg {
       fill: #ffffff !important;
    }
    .abcjs-inline-audio .abcjs-btn.abcjs-pushed:hover {
       background-color: #1d4ed8 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const standardSongs = [
      {
        title: "Autumn Leaves",
        key: "Gm",
        measures: 32,
        chords: [
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Am7b5", "D7", "Gm7", "Gm7", "Cm7", "F7", "Bbmaj7", "Ebmaj7",
          "Am7b5", "D7", "Gm7 C7", "Fm7 Bb7", "Ebmaj7", "Am7b5 D7", "Gm7", "Gm7"
        ]
      },
      {
        title: "Blue Bossa",
        key: "Cm",
        measures: 16,
        chords: [
          "Cm7", "Cm7", "Fm7", "Fm7", "Dm7b5", "G7", "Cm7", "Cm7",
          "Ebm7", "Ab7", "Dbmaj7", "Dbmaj7", "Dm7b5", "G7", "Cm7", "Dm7b5 G7"
        ]
      },
      {

        measures: 16,
        chords: [
          "Cmaj7", "Em7b5 A7", "Dm7", "G7", "Cmaj7", "Em7b5 A7", "Dm7", "G7",
          "Em7b5", "A7", "Dm7", "G7", "Cmaj7 C7", "Fmaj7 F#dim7", "Cmaj7 G7", "Cmaj7"
        ]
      },
      {

          "Bmaj7", "Fm7 Bb7", "Ebmaj7", "C#m7 F#7"
        ]
      },
      {
        title: "All The Things You Are",
        key: "Ab",
        measures: 36,
        chords: [
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "G7", "Cmaj7", "Cmaj7",
          "Cm7", "Fm7", "Bb7", "Ebmaj7", "Abmaj7", "D7", "Gmaj7", "Gmaj7",
          "Am7", "D7", "Gmaj7", "Gmaj7", "F#m7b5", "B7", "Emaj7", "C7#5",
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "Dbm7", "Cm7", "Bdim7",
          "Bbm7", "Eb7", "Abmaj7", "Abmaj7"
        ]
      },
      {
        title: "Donna Lee",
        key: "Ab",
        measures: 32,
        chords: [
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Bbm7", "Bb7", "Bb7",
          "Bbm7", "Eb7", "Abmaj7", "F7", "Bbm7", "C7", "Fm7", "C7",
          "Fm7", "Fm7", "C7", "C7", "Fm7", "Fm7", "Eb7", "Eb7",
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Edim7", "Abmaj7 F7", "Bbm7 Eb7"
        ]
      },
      {
        title: "Stella by Starlight",
        key: "Bb",
        measures: 32,
        chords: [
          "Em7b5", "A7", "Cm7", "F7", "Fm7", "Bb7", "Ebmaj7", "Ebmaj7",
          "Ab7", "Ab7", "Bbmaj7", "Bbmaj7", "Em7b5", "A7", "Dm7", "Dm7",
          "Bbm7", "Eb7", "Fmaj7", "Fmaj7", "Em7b5", "A7", "Am7b5", "D7",
          "G7", "G7", "Cm7", "Cm7", "Ab7", "Ab7", "Bbmaj7", "Bbmaj7"
        ]
      },
      {
        title: "There Will Never Be Another You",
        key: "Eb",
        measures: 32,
        chords: [
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Abmaj7", "Ebmaj7", "Ebmaj7", "Fm7", "Fm7", "Bb7", "Bb7",
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Db7", "Ebmaj7 C7", "Fm7 Bb7", "Ebmaj7", "Fm7", "Bb7", "Bb7"
        ]
      }
    ];

    const PITCH_CLASSES = {
      'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
      'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8,
      'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
    };

    const KEY_FLATS = {
      'Gm': ['B', 'E'],
      'Bb': ['B', 'E'],
      'Cm': ['B', 'E', 'A'],
      'Eb': ['B', 'E', 'A'],
      'Ab': ['B', 'E', 'A', 'D'],
      'F': ['B'],
      'C': []
    };

    // ============================================================================
    // ★ジャズ・ジャイアンツのフレーズ辞書（2拍セル＝1ハーフ小節単位）
    // slots配列内の degreeIdx:
    //   0 = Root, 1 = 3rd(or b3), 2 = 5th(or b5), 3 = 7th(or △7)
    //   'alt1' = b9/#9, 'alt2' = #11/b13 (V7でオルタード/コンディミ選択時に自動適用)
    //   octaveShift: 0 または +1 / -1
    // ============================================================================
    const JAZZ_GIANT_HALF_CELLS_BEAT12 = [
      {
        // Charlie Parker: 8分休符（裏拍入り）から 3rd -> 5th -> 7th と駆け上がる定番ビバップ導入
        artist: "Charlie Parker (Offbeat Arpeggio)",
        pattern: "z_8_88",
        notes: [
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 }
        ]
      },
      {
        // Wes Montgomery: 1拍目頭(3rd)から2拍目に「5th - 7th - 5th」の3連モルデント・ターン
        artist: "Wes Montgomery (Bebop Triplet Turn)",
        pattern: "88_trip",
        notes: [
          { degIdx: 0, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 },
          { degIdx: 2, oct: 0 }
        ]
      },
      {
        // Sonny Rollins: 1拍目4分音符（ガイドトーン3rd）でしっかり歌い、2拍目8分2個で5th->7thへ
        artist: "Sonny Rollins (Guide Tone & Pickup)",
        pattern: "4_88",
        notes: [
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 }
        ]
      },
      {
        // John Coltrane: 1-3-5-7 の王道デジタル・アルペジオ上昇
        artist: "John Coltrane (1-3-5-7 Digital Ascent)",
        pattern: "88_88",
        notes: [
          { degIdx: 0, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 }
        ]
      },
      {
        // Clifford Brown: 7th -> 5th -> 3rd -> Root の流麗なアルペジオ下降
        artist: "Clifford Brown (7-5-3-1 Arpeggio Drop)",
        pattern: "88_88",
        notes: [
          { degIdx: 3, oct: 1 },
          { degIdx: 2, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 0, oct: 0 }
        ]
      },
      {
        // Grant Green: 1拍目裏休符でシンコペーションし、2拍目裏から飛び出すファンキー・バップ
        artist: "Grant Green (Syncopated Hop)",
        pattern: "8z_z8",
        notes: [
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 }
        ]
      }
    ];

    // 後半（3〜4拍目）：★必ず小節線を跨いで（Over-the-Barline）次の小節へ推進するジャイアンツ語彙
    const JAZZ_GIANT_HALF_CELLS_BEAT34 = [
      {
        // Charlie Parker: 3拍目に「3rd - 5th - 3rd」の美しいビバップ3連ターン -> 4拍目は Root -> 7th で次小節へ解決
        artist: "Charlie Parker (Bird Turn Over-the-Bar)",
        pattern: "trip_88",
        notes: [
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 0, oct: 0 },
          { degIdx: 3, oct: -1 }
        ]
      },
      {
        // Sonny Stitt: 3拍目8分休符（ブレス）から裏拍で入り、4拍目8分2個で次小節のガイドトーンへ飛び込む
        artist: "Sonny Stitt (Breath & Drive)",
        pattern: "z8_88",
        notes: [
          { degIdx: 0, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 }
        ]
      },
      {
        // Kenny Burrell: 3拍目〜4拍目を駆け抜ける 3rd -> 5th -> 7th -> 3rd(Oct) のスウィングライン
        artist: "Kenny Burrell (Swing Line Drive)",
        pattern: "88_88",
        notes: [
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 3, oct: 0 },
          { degIdx: 0, oct: 1 }
        ]
      },
      {
        // Dizzy Gillespie: 3拍目8分2個から、4拍目に「R - 3rd - 5th」の3連アルペジオ・ロケットで小節線を突破
        artist: "Dizzy Gillespie (4th-Beat Triplet Rocket)",
        pattern: "88_trip",
        notes: [
          { degIdx: 3, oct: 0 },
          { degIdx: 2, oct: 0 },
          { degIdx: 0, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 2, oct: 0 }
        ]
      },
      {
        // Bill Evans / Jim Hall: 3拍目を4分音符で溜め、4拍目の8分2個で次小節へ優雅に橋渡し
        artist: "Jim Hall (Lyrical Bridge)",
        pattern: "4_88",
        notes: [
          { degIdx: 2, oct: 0 },
          { degIdx: 1, oct: 0 },
          { degIdx: 3, oct: 0 }
        ]
      }
    ];

    // V7（オルタード／コンディミ選択時）専用のジャズ・ジャイアンツ解決セル（3〜4拍目またはV7箇所）
    const JAZZ_GIANT_V7_TENSION_CELLS = [
      {
        // Bird Altered Line: b13 -> #9 -> b9 -> 3rd で次小節のトニック3度へ完璧に着地
        artist: "Charlie Parker (Altered Resolution)",
        pattern: "88_88",
        intervals: [8, 3, 1, 4] // b13, #9, b9, 3rd
      },
      {
        // Coltrane H-W Dim / Altered Triplet: (3連: #9 - b9 - R) -> b7 -> 3rd
        artist: "John Coltrane (Tension Triplet Turn)",
        pattern: "trip_88",
        intervals: [3, 1, 0, 10, 4] // (3: #9, b9, R), b7, 3rd
      },
      {
        // Wes Altered Pickup: z(裏入り) #11 -> b13 -> #9
        artist: "Wes Montgomery (Tritone Sub Line)",
        pattern: "z8_88",
        intervals: [6, 8, 3] // #11, b13, #9
      }
    ];

    function App() {
      const [measureCount, setMeasureCount] = useState(32);
      const [bpm, setBpm] = useState(130);
      const [chords, setChords] = useState(Array(64).fill(""));
      const [currentSong, setCurrentSong] = useState(standardSongs[0]);
      const [v7Approach, setV7Approach] = useState("chordtone"); // chordtone, altered, condim
      const [tabView, setTabView] = useState("guitar"); // guitar, bass, none
      const [showDegrees, setShowDegrees] = useState(true);
      
      const [abcString, setAbcString] = useState("");
      const [audioAbcString, setAudioAbcString] = useState("");
      const [backingAbcString, setBackingAbcString] = useState("");
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      
      const [abcjsLoaded, setAbcjsLoaded] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const audioRef = useRef(null);
      const synthRef = useRef(null);

      useEffect(() => {
        const song = standardSongs[0];
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSong(song);
      }, []);

      useEffect(() => {
        if (window.ABCJS) {
          setAbcjsLoaded(true);
          return;
        }
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js";
        script.async = true;
        script.onload = () => setAbcjsLoaded(true);
        document.body.appendChild(script);
      }, []);

      useEffect(() => {
        if (abcjsLoaded && chords[0] !== "" && abcString === "") {
          generateEtude();
        }
      }, [abcjsLoaded, chords]);

      // レンダリングとTAB調整
      useEffect(() => {
        if (abcjsLoaded && abcString && window.ABCJS) {
          let tablatureOptions = [];
          
          if (tabView === 'guitar') {
            tablatureOptions = [{
              instrument: 'guitar',
              label: 'TAB (Gt)',
              tuning: ['E,', 'A,', 'D', 'G', 'B', 'e']
            }];
          } else if (tabView === 'bass') {
            tablatureOptions = [{
              instrument: 'bass',
              label: 'TAB (Bass 8vb)',
              tuning: ['E,', 'A,', 'D', 'G']
            }];
          }

          window.ABCJS.renderAbc("paper", abcString, {
            responsive: "resize",
            add_classes: true,
            paddingtop: 20,
            paddingbottom: 30,
            paddingleft: 0,
            paddingright: 0,
            staffwidth: 820,
            tablature: tablatureOptions
          });

          if (tabView !== 'none') {
            refineTabSvg(tabView === 'bass');
          }

          const currentAudioString = isBackingOnly ? backingAbcString : audioAbcString;
          const visualObjForAudio = window.ABCJS.renderAbc("audio-paper", currentAudioString, {
            add_classes: true
          })[0];

          if (window.ABCJS.synth.supportsAudio() && audioRef.current) {
            if (synthRef.current) {
              synthRef.current.pause();
              synthRef.current.disable(true);
            }
            audioRef.current.innerHTML = "";

            const cursorControl = {
              onStart: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              },
              onEvent: function(ev) {
                if (!ev || (ev.measureStart && ev.left === null)) return;
                const displaySvg = document.querySelector("#paper svg");
                const audioSvg = document.querySelector("#audio-paper svg");
                if (!displaySvg || !audioSvg) return;

                displaySvg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));

                if (ev.elements && Array.isArray(ev.elements)) {
                  const audioNotes = Array.from(audioSvg.querySelectorAll(".abcjs-v0 .abcjs-note, .abcjs-v0 .abcjs-rest"));
                  const displayNotes = Array.from(displaySvg.querySelectorAll(".abcjs-note, .abcjs-rest"));

                  ev.elements.forEach(element => {
                    if (!element) return;
                    let index = audioNotes.indexOf(element);
                    if (index === -1 && element.closest) {
                      const parent = element.closest('.abcjs-note, .abcjs-rest');
                      if (parent) index = audioNotes.indexOf(parent);
                    }
                    if (index !== -1 && displayNotes[index]) {
                      displayNotes[index].classList.add("abcjs-highlight");
                    }
                  });
                }
              },
              onFinished: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              }
            };

            const synthControl = new window.ABCJS.synth.SynthController();
            synthControl.load(audioRef.current, cursorControl, {
              displayLoop: true,
              displayRestart: true,
              displayPlay: true,
              displayProgress: true,
              displayWarp: false 
            });

            synthControl.setTune(visualObjForAudio, false, { chordsOff: true }).catch(console.error);
            synthRef.current = synthControl;
          }
        }
      }, [abcString, audioAbcString, backingAbcString, isBackingOnly, abcjsLoaded, tabView, showDegrees]);

      // TABのSVG補正（開放弦0排除・ベース4本線化・ボックス運指補正）
      const refineTabSvg = (isBass) => {
        const svg = document

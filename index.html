<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adlib solo etude for standards</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-audio.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>

  <style>
    .abcjs-css-warning { display: none !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .abcjs-note { fill: #0f172a; }
    .abcjs-staff { stroke: #64748b; }
    .abcjs-highlight { fill: #2563eb !important; stroke: #2563eb !important; }
    .abcjs-tempo { display: none !important; }

    .abcjs-chord { font-size: 15px !important; font-weight: 800 !important; fill: #0f172a !important; }
    .abcjs-lyric { font-size: 11px !important; font-weight: 700 !important; fill: #b45309 !important; font-family: sans-serif !important; }

    #paper { padding-bottom: 20px; }
    #paper svg { 
      overflow: visible !important; 
      margin-bottom: 30px !important; 
      width: 100% !important;
      height: auto !important;
    }

    .abcjs-inline-audio { margin: 0; padding: 10px; display: flex; align-items: center; gap: 8px; justify-content: center; }
    .abcjs-inline-audio .abcjs-btn {
       background-color: #f1f5f9 !important;
       border: 1px solid #cbd5e1 !important;
       border-radius: 8px !important;
       color: #334155 !important;
       width: 36px !important;
       height: 36px !important;
       cursor: pointer;
       display: inline-flex !important;
       align-items: center;
       justify-content: center;
       margin: 0 4px;
       padding: 0 !important;
       transition: all 0.15s ease-in-out !important;
    }
    .abcjs-inline-audio .abcjs-btn:hover { background-color: #e2e8f0 !important; }
    .abcjs-inline-audio .abcjs-btn svg { width: 18px !important; height: 18px !important; fill: #334155 !important; }

    .abcjs-inline-audio .abcjs-btn.abcjs-pushed {
       background-color: #2563eb !important;
       border-color: #1d4ed8 !important;
       color: #ffffff !important;
       box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25) !important;
    }
    .abcjs-inline-audio .abcjs-btn.abcjs-pushed svg { fill: #ffffff !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const standardSongs = [
      {
        title: "Autumn Leaves",
        key: "Gm",
        measures: 32,
        chords: [
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Am7b5", "D7", "Gm7", "Gm7", "Cm7", "F7", "Bbmaj7", "Ebmaj7",
          "Am7b5", "D7", "Gm7 C7", "Fm7 Bb7", "Ebmaj7", "Am7b5 D7", "Gm7", "Gm7"
        ]
      },
      {
        title: "Blue Bossa",
        key: "Cm",
        measures: 16,
        chords: [
          "Cm7", "Cm7", "Fm7", "Fm7", "Dm7b5", "G7", "Cm7", "Cm7",
          "Ebm7", "Ab7", "Dbmaj7", "Dbmaj7", "Dm7b5", "G7", "Cm7", "Dm7b5 G7"
        ]
      },
      {
        title: "St. Thomas",
        key: "C",
        measures: 16,
        chords: [
          "Cmaj7", "Em7b5 A7", "Dm7", "G7", "Cmaj7", "Em7b5 A7", "Dm7", "G7",
          "Em7b5", "A7", "Dm7", "G7", "Cmaj7 C7", "Fmaj7 F#dim7", "Cmaj7 G7", "Cmaj7"
        ]
      },
      {
        title: "Giant Steps",
        key: "C",
        measures: 16,
        chords: [
          "Bmaj7 D7", "Gmaj7 Bb7", "Ebmaj7", "Am7 D7",
          "Gmaj7 Bb7", "Ebmaj7 F#7", "Bmaj7", "Fm7 Bb7",
          "Ebmaj7", "Am7 D7", "Gmaj7", "C#m7 F#7",
          "Bmaj7", "Fm7 Bb7", "Ebmaj7", "C#m7 F#7"
        ]
      }
    ];

    const PITCH_CLASSES = {
      'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
      'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8,
      'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
    };

    const KEY_FLATS = {
      'Gm': ['B', 'E'],
      'Bb': ['B', 'E'],
      'Cm': ['B', 'E', 'A'],
      'Eb': ['B', 'E', 'A'],
      'Ab': ['B', 'E', 'A', 'D'],
      'F': ['B'],
      'C': []
    };

    const JAZZ_GIANT_HALF_CELLS_BEAT12 = [
      { artist: "Charlie Parker", pattern: "z_8_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0}] },
      { artist: "Wes Montgomery", pattern: "88_trip", notes: [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0},{degIdx:2,oct:0}] },
      { artist: "John Coltrane", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0}] },
      { artist: "Clifford Brown", pattern: "88_88", notes: [{degIdx:3,oct:1},{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:0,oct:0}] },
      { artist: "Joe Pass (1-5-3-7)", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:3,oct:0}] },
      { artist: "Thelonious Monk (1-7-3-5)", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:3,oct:-1},{degIdx:1,oct:0},{degIdx:2,oct:0}] },
      { artist: "Lage Lund (Open Triad)", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:2,oct:0},{degIdx:1,oct:1},{degIdx:0,oct:1}] },
      { artist: "Tim Miller (Wide Spread)", pattern: "88_88", notes: [{degIdx:1,oct:0},{degIdx:0,oct:1},{degIdx:3,oct:0},{degIdx:2,oct:1}] },
      { artist: "Modern Spread", pattern: "z8_88", notes: [{degIdx:2,oct:-1},{degIdx:0,oct:0},{degIdx:3,oct:0}] },
      { artist: "Start 3rd Ascend", pattern: "88_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0},{degIdx:0,oct:1}] },
      { artist: "Start 3rd Descend", pattern: "88_88", notes: [{degIdx:1,oct:0},{degIdx:0,oct:0},{degIdx:3,oct:-1},{degIdx:2,oct:-1}] },
      { artist: "Start 3rd Triplet", pattern: "trip_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:0,oct:0},{degIdx:3,oct:-1}] }
    ];

    const JAZZ_GIANT_HALF_CELLS_BEAT34 = [
      { artist: "Charlie Parker", pattern: "trip_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:0,oct:0},{degIdx:3,oct:-1}] },
      { artist: "Sonny Stitt", pattern: "z8_88", notes: [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0}] },
      { artist: "Kenny Burrell", pattern: "88_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0},{degIdx:0,oct:1}] },
      { artist: "Dizzy Gillespie", pattern: "88_trip", notes: [{degIdx:3,oct:0},{degIdx:2,oct:0},{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0}] },
      { artist: "Jim Hall", pattern: "4_88", notes: [{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:3,oct:0}] },
      { artist: "Paul Chambers", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0}] },
      { artist: "Wayne Shorter", pattern: "88_88", notes: [{degIdx:3,oct:0},{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:0,oct:0}] },
      { artist: "Guide Tone Target", pattern: "88_88", notes: [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0}] },
      { artist: "Barry Harris", pattern: "88_88", notes: [{degIdx:2,oct:0},{degIdx:1,oct:0},{degIdx:0,oct:0},{degIdx:3,oct:-1}] },
      { artist: "Pivot Target 7th", pattern: "88_88", notes: [{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:0,oct:0},{degIdx:3,oct:-1}] },
      { artist: "Triplet Drop 7th", pattern: "trip_88", notes: [{degIdx:0,oct:0},{degIdx:2,oct:-1},{degIdx:1,oct:-1},{degIdx:0,oct:-1},{degIdx:3,oct:-2}] }
    ];

    const V7_ALTERED_CELLS = [
      { pattern: "88_88", intervals: [8, 3, 1, 4] },
      { pattern: "trip_88", intervals: [3, 1, 0, -2, 4] },
      { pattern: "z8_88", intervals: [6, 8, 3] },
      { pattern: "88_88", intervals: [4, 6, 8, 10] },
      { pattern: "88_88", intervals: [1, 3, 8, 10] },
      { pattern: "trip_88", intervals: [4, 1, 0, 8, 10] }
    ];

    const V7_CONDIM_CELLS = [
      { pattern: "88_88", intervals: [9, 6, 7, 4] },
      { pattern: "88_88", intervals: [1, 3, 4, 6] },
      { pattern: "88_88", intervals: [7, 9, 13, 10] },
      { pattern: "88_88", intervals: [6, 7, 9, 10] },
      { pattern: "trip_88", intervals: [3, 0, -2, -5, -2] }
    ];

    function App() {
      const [measureCount, setMeasureCount] = useState(32);
      const [bpm, setBpm] = useState(130);
      const [chords, setChords] = useState(Array(64).fill(""));
      const [currentSong, setCurrentSong] = useState(standardSongs[0]);
      
      const [arpeggioMode, setArpeggioMode] = useState("7th"); // "triad", "7th", "ust"
      const [v7Approach, setV7Approach] = useState("chordtone"); // chordtone, altered, condim
      const [tabView, setTabView] = useState("guitar"); // guitar, bass, none
      const [showDegrees, setShowDegrees] = useState(true);
      
      const [abcString, setAbcString] = useState("");
      const [audioAbcString, setAudioAbcString] = useState("");
      const [backingAbcString, setBackingAbcString] = useState("");
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      const [tabNotesData, setTabNotesData] = useState([]);
      
      const [abcjsLoaded, setAbcjsLoaded] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const audioRef = useRef(null);
      const synthRef = useRef(null);

      useEffect(() => {
        const song = standardSongs[0];
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSong(song);
      }, []);

      useEffect(() => {
        if (window.ABCJS) {
          setAbcjsLoaded(true);
          return;
        }
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js";
        script.async = true;
        script.onload = () => setAbcjsLoaded(true);
        document.body.appendChild(script);
      }, []);

      useEffect(() => {
        if (abcjsLoaded && chords[0] !== "" && abcString === "") {
          generateEtude();
        }
      }, [abcjsLoaded, chords, arpeggioMode, v7Approach]);

      useEffect(() => {
        if (abcjsLoaded && abcString && window.ABCJS) {
          let tablatureOptions = [];
          
          if (tabView === 'guitar') {
            tablatureOptions = [{
              instrument: 'guitar',
              label: 'TAB (Gt 6〜20F)',
              tuning: ['E,', 'A,', 'D', 'G', 'B', 'e']
            }];
          } else if (tabView === 'bass') {
            tablatureOptions = [{
              instrument: 'guitar',
              label: 'TAB (Bass 8vb)',
              tuning: ['E,', 'A,', 'D', 'G', 'B', 'e'] 
            }];
          }

          window.ABCJS.renderAbc("paper", abcString, {
            responsive: "resize",
            add_classes: true,
            paddingtop: 25,
            paddingbottom: 30,
            paddingleft: 0,
            paddingright: 0,
            staffwidth: 820,
            tablature: tablatureOptions
          });

          if (tabView !== 'none' && tabNotesData.length > 0) {
            applyAccurateTabToSvg(tabView === 'bass', tabNotesData);
          }

          const currentAudioString = isBackingOnly ? backingAbcString : audioAbcString;
          const visualObjForAudio = window.ABCJS.renderAbc("audio-paper", currentAudioString, {
            add_classes: true
          })[0];

          if (window.ABCJS.synth.supportsAudio() && audioRef.current) {
            if (synthRef.current) {
              synthRef.current.pause();
              synthRef.current.disable(true);
            }
            audioRef.current.innerHTML = "";

            const cursorControl = {
              onStart: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              },
              onEvent: function(ev) {
                if (!ev || (ev.measureStart && ev.left === null)) return;
                const displaySvg = document.querySelector("#paper svg");
                const audioSvg = document.querySelector("#audio-paper svg");
                if (!displaySvg || !audioSvg) return;

                displaySvg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));

                if (ev.elements && Array.isArray(ev.elements)) {
                  const audioNotes = Array.from(audioSvg.querySelectorAll(".abcjs-v0 .abcjs-note, .abcjs-v0 .abcjs-rest"));
                  const displayNotes = Array.from(displaySvg.querySelectorAll(".abcjs-note, .abcjs-rest"));

                  ev.elements.forEach(element => {
                    if (!element) return;
                    let index = audioNotes.indexOf(element);
                    if (index === -1 && element.closest) {
                      const parent = element.closest('.abcjs-note, .abcjs-rest');
                      if (parent) index = audioNotes.indexOf(parent);
                    }
                    if (index !== -1 && displayNotes[index]) {
                      displayNotes[index].classList.add("abcjs-highlight");
                    }
                  });
                }
              },
              onFinished: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              }
            };

            const synthControl = new window.ABCJS.synth.SynthController();
            synthControl.load(audioRef.current, cursorControl, {
              displayLoop: true,
              displayRestart: true,
              displayPlay: true,
              displayProgress: true,
              displayWarp: false 
            });

            synthControl.setTune(visualObjForAudio, false, { chordsOff: true }).catch(console.error);
            synthRef.current = synthControl;
          }
        }
      }, [abcString, audioAbcString, backingAbcString, isBackingOnly, abcjsLoaded, tabView, showDegrees, tabNotesData]);

      const applyAccurateTabToSvg = (isBass, notesList) => {
        const svg = document.querySelector("#paper svg");
        if (!svg) return;

        const allPathsAndLines = Array.from(svg.querySelectorAll("path, line"));
        const horizontalLines = allPathsAndLines.filter(el => {
          try {
            const box = el.getBBox();
            return box.width > 300 && box.height < 2.5;
          } catch (e) { return false; }
        });

        horizontalLines.sort((a, b) => a.getBBox().y - b.getBBox().y);

        let staffClusters = [];
        horizontalLines.forEach(line => {
          const y = line.getBBox().y;
          if (staffClusters.length === 0) {
            staffClusters.push([line]);
          } else {
            const currentCluster = staffClusters[staffClusters.length - 1];
            const prevY = currentCluster[currentCluster.length - 1].getBBox().y;
            if (Math.abs(y - prevY) < 1.0) {
            } else if (y - prevY < 18) {
              currentCluster.push(line);
            } else {
              staffClusters.push([line]);
            }
          }
        });

        const tabClusters = staffClusters.filter(c => c.length === 6);
        const allTextEls = Array.from(svg.querySelectorAll("text"));

        let globalNoteIdx = 0;

        tabClusters.forEach(tabLines => {
          const lineYs = tabLines.map(l => l.getBBox().y);
          const yTop = lineYs[0];
          const yBot = lineYs[5];
          const lineBounds = tabLines[0].getBBox();

          const tabNumberTexts = allTextEls.filter(txt => {
            const str = txt.textContent.trim();
            if (!/^[0-9?]+$/.test(str)) return false;
            if (txt.classList.contains("abcjs-bar-number") || txt.closest(".abcjs-time-signature")) return false;
            try {
              const box = txt.getBBox();
              const cy = box.y + box.height / 2;
              return cy >= yTop - 10 && cy <= yBot + 10 && box.x > lineBounds.x + 25;
            } catch (e) { return false; }
          });

          tabNumberTexts.sort((a, b) => a.getBBox().x - b.getBBox().x);

          tabNumberTexts.forEach(txt => {
            if (globalNoteIdx >= notesList.length) return;
            const target = isBass ? notesList[globalNoteIdx].bass : notesList[globalNoteIdx].guitar;
            globalNoteIdx++;

            const box = txt.getBBox();
            const cy = box.y + box.height / 2;
            let oldStringIdx = 0;
            let minDist = 999;
            lineYs.forEach((ly, idx) => {
              const d = Math.abs(cy - ly);
              if (d < minDist) {
                minDist = d;
                oldStringIdx = idx;
              }
            });

            const newStringIdx = target.string - 1; 
            const deltaY = lineYs[newStringIdx] - lineYs[oldStringIdx];

            const tspan = txt.querySelector("tspan");
            if (tspan) {
              tspan.textContent = String(target.fret);
            } else {
              txt.textContent = String(target.fret);
            }

            if (txt.hasAttribute("y")) {
              const curY = parseFloat(txt.getAttribute("y"));
              if (!isNaN(curY)) txt.setAttribute("y", String(curY + deltaY));
            }
            if (tspan && tspan.hasAttribute("y")) {
              const curTspanY = parseFloat(tspan.getAttribute("y"));
              if (!isNaN(curTspanY)) tspan.setAttribute("y", String(curTspanY + deltaY));
            }
          });

          if (isBass) {
            tabLines[4].style.display = "none";
            tabLines[5].style.display = "none";

            const yFourth = lineYs[3];
            allPathsAndLines.forEach(el => {
              if (tabLines.includes(el)) return;
              try {
                const box = el.getBBox();
                if (box.width < 6 && box.height > 20 && Math.abs(box.y - yTop) < 8) {
                  el.style.display = "none";
                  const newBar = document.createElementNS("http://www.w3.org/2000/svg", "line");
                  newBar.setAttribute("x1", String(box.x + box.width / 2));
                  newBar.setAttribute("y1", String(yTop));
                  newBar.setAttribute("x2", String(box.x + box.width / 2));
                  newBar.setAttribute("y2", String(yFourth));
                  newBar.setAttribute("stroke", "#64748b");
                  newBar.setAttribute("stroke-width", box.width > 2 ? "2" : "1.2");
                  svg.appendChild(newBar);
                }
                else if (box.x < lineBounds.x + 30 && box.width < 30 && box.y >= yTop - 5 && box.y + box.height > yFourth + 3) {
                  const scale = (yFourth - yTop) / (yBot - yTop);
                  el.setAttribute("transform", `translate(0, ${yTop * (1 - scale)}) scale(1, ${scale})`);
                }
              } catch (e) {}
            });

            allTextEls.forEach(txt => {
              if (txt.textContent.includes("TAB (Bass")) {
                try {
                  const box = txt.getBBox();
                  if (box.y > yFourth && box.y < yBot + 35) {
                    const curY = parseFloat(txt.getAttribute("y"));
                    if (!isNaN(curY)) txt.setAttribute("y", String(curY - (yBot - yFourth)));
                  }
                } catch (e) {}
              }
            });
          }
        });
      };

      const calcBestGuitarTab = (midi, prevFretRef) => {
        const openPitches = [64, 59, 55, 50, 45, 40];
        let candidates = [];

        for (let s = 0; s < 6; s++) {
          const fret = midi - openPitches[s];
          if (fret >= 6 && fret <= 20) {
            const distFromPrev = Math.abs(fret - prevFretRef.current);
            candidates.push({ string: s + 1, fret, score: distFromPrev });
          }
        }

        if (candidates.length > 0) {
          candidates.sort((a, b) => a.score - b.score);
          const chosen = candidates[0];
          prevFretRef.current = prevFretRef.current * 0.6 + chosen.fret * 0.4;
          return { string: chosen.string, fret: chosen.fret };
        }
        return { string: 6, fret: Math.max(6, midi - 40) };
      };

      const calcBestBassTab = (midi, prevFretRef) => {
        let bassMidi = midi - 12;
        while (bassMidi > 55) bassMidi -= 12;
        while (bassMidi < 29) bassMidi += 12;

        const openPitches = [43, 38, 33, 28];
        let candidates = [];

        for (let s = 0; s < 4; s++) {
          const fret = bassMidi - openPitches[s];
          if (fret >= 2 && fret <= 12) {
            const distFromPrev = Math.abs(fret - prevFretRef.current);
            candidates.push({ string: s + 1, fret, score: distFromPrev });
          }
        }

        if (candidates.length > 0) {
          candidates.sort((a, b) => a.score - b.score);
          const chosen = candidates[0];
          prevFretRef.current = prevFretRef.current * 0.6 + chosen.fret * 0.4;
          return { string: chosen.string, fret: chosen.fret };
        }
        return { string: 1, fret: Math.min(12, Math.max(2, bassMidi - 43)) };
      };

      const getChordToneInfo = (chordStr) => {
        const match = chordStr.match(/^[A-G][#b]?/);
        const root = match ? match[0] : 'C';
        const rootPitch = PITCH_CLASSES[root] || 0;
        const type = chordStr.substring(root.length);

        const isMinor = type.includes('m') && !type.includes('maj');
        const isDim = type.includes('dim') || type.includes('m7b5');
        const isMajor = type.includes('maj') || type.includes('M7') || type.includes('△');
        const isV7 = type.includes('7') && !isMinor && !isMajor && !isDim;

        // 9thの半音オフセット (m7b5, dimの場合はb9)
        let ninthOffset = 2;
        if (type.includes('m7b5') || type.includes('dim')) ninthOffset = 1; 

        const basicOffsets = [
          0,
          isMinor || isDim ? 3 : 4,
          isDim ? 6 : 7,
          isMajor ? 11 : (type.includes('dim7') ? 9 : 10),
          ninthOffset // degIdx: 4
        ];

        return {
          rootPitch,
          basicOffsets,
          isV7,
          chordStr
        };
      };

      const getExactDegree = (pitchClass, rootPitch, isV7) => {
        const diff = (pitchClass - rootPitch + 12) % 12;
        switch (diff) {
          case 0: return "R";
          case 1: return isV7 ? "♭9" : "b2";
          case 2: return "9";
          case 3: return isV7 ? "♯9" : "♭3";
          case 4: return "3";
          case 5: return "11";
          case 6: return isV7 ? "♯11" : "♭5";
          case 7: return "5";
          case 8: return isV7 ? "♭13" : "#5";
          case 9: return isV7 ? "13" : "6";
          case 10: return "7";
          case 11: return "△7";
          default: return "";
        }
      };

      const midiToAbcByKey = (midi, keySig, measureAccRef) => {
        const flatsInKey = KEY_FLATS[keySig] || [];
        const pitchClass = midi % 12;
        const octave = Math.floor(midi / 12) - 1;

        let baseName = "";
        let targetState = "natural";

        switch (pitchClass) {
          case 0:  baseName = "C"; targetState = "natural"; break;
          case 1:  baseName = "D"; targetState = "flat"; break;
          case 2:  baseName = "D"; targetState = "natural"; break;
          case 3:  baseName = "E"; targetState = "flat"; break;
          case 4:  baseName = "E"; targetState = "natural"; break;
          case 5:  baseName = "F"; targetState = "natural"; break;
          case 6:  baseName = "G"; targetState = "flat"; break;
          case 7:  baseName = "G"; targetState = "natural"; break;
          case 8:  baseName = "A"; targetState = "flat"; break;
          case 9:  baseName = "A"; targetState = "natural"; break;
          case 10: baseName = "B"; targetState = "flat"; break;
          case 11: baseName = "B"; targetState = "natural"; break;
        }

        let abc = baseName;
        if (octave === 3) abc = baseName + ",";
        else if (octave === 4) abc = baseName;
        else if (octave === 5) abc = baseName.toLowerCase();
        else if (octave === 6) abc = baseName.toLowerCase() + "'";

        const defaultState = flatsInKey.includes(baseName) ? "flat" : "natural";
        const key = baseName + octave;
        const currentState = measureAccRef[key] !== undefined ? measureAccRef[key] : defaultState;

        let prefix = "";
        if (targetState !== currentState) {
          if (targetState === "flat") prefix = "_";
          else if (targetState === "sharp") prefix = "^";
          else if (targetState === "natural") prefix = "=";
          measureAccRef[key] = targetState;
        }

        return prefix + abc;
      };

      const getPianoVoicing = (chordStr, keySig, accRef, beats = 4) => {
        const match = chordStr.match(/^[A-G][#b]?/);
        const root = match ? match[0] : 'C';
        const rootPitch = PITCH_CLASSES[root] || 0;
        
        const isMinor = chordStr.includes('m') && !chordStr.includes('maj');
        const thirdPitch = rootPitch + (isMinor ? 3 : 4);
        const seventhPitch = rootPitch + (chordStr.includes('maj') || chordStr.includes('M7') ? 11 : 10);

        const r = midiToAbcByKey(48 + rootPitch, keySig, accRef);
        const t = midiToAbcByKey(60 + (thirdPitch % 12), keySig, accRef);
        const s = midiToAbcByKey(60 + (seventhPitch % 12), keySig, accRef);

        return `[${r}${t}${s}]${beats}`;
      };

      const generateEtude = () => {
        let fullLines = [];
        let audioMelody = "";
        let compingStr = "";
        let allTabNotes = [];

        const keySig = currentSong.key || "C";
        
        const SAFE_MIN = tabView === 'bass' ? 41 : 53; 
        const SAFE_MAX = tabView === 'bass' ? 67 : 84; 
        
        let prevPitch = tabView === 'bass' ? 48 : 60;
        const prevGuitarFretRef = { current: 7 };
        const prevBassFretRef = { current: 5 };

        let execPlan = [];
        for (let m = 0; m < measureCount; m++) {
          const chordRaw = chords[m] || "Cmaj7";
          const chordList = chordRaw.split(/\s+/).filter(c => c.length > 0);
          const chord1 = chordList[0] || "Cmaj7";
          const chord2 = chordList.length >= 2 ? chordList[1] : chord1;

          execPlan.push({ measure: m, half: 1, chordStr: chord1, forceEnd7th: false, forceEnd5th: false, forceStart3rd: false });
          execPlan.push({ measure: m, half: 2, chordStr: chord2, forceEnd7th: false, forceEnd5th: false, forceStart3rd: false });
        }

        for (let i = 0; i < execPlan.length - 1; i++) {
          const currInfo = getChordToneInfo(execPlan[i].chordStr);
          const nextInfo = getChordToneInfo(execPlan[i+1].chordStr);
          const interval = (nextInfo.rootPitch - currInfo.rootPitch + 12) % 12;

          // 4度進行 (60%の確率でガイドトーン解決)
          if (interval === 5) {
            if (Math.random() < 0.60) {
              if (arpeggioMode === '7th' || arpeggioMode === 'ust') {
                execPlan[i].forceEnd7th = true;
              } else {
                execPlan[i].forceEnd5th = true;
              }
              execPlan[i+1].forceStart3rd = true;
            }
          }
        }

        const realizeGiantCell = (cellList, chordInfo, accRef, degreeTokensOut, requireStart3rd, requireEnd7th, requireEnd5th) => {
          let validCells = cellList;
          
          if (requireStart3rd) {
            const filtered = validCells.filter(c => c.notes && c.notes[0].degIdx === 1);
            if (filtered.length > 0) validCells = filtered;
          }
          if (requireEnd7th && (arpeggioMode === '7th' || arpeggioMode === 'ust')) {
            const filtered = validCells.filter(c => {
              if (c.notes) return c.notes[c.notes.length - 1].degIdx === 3;
              if (c.intervals) return c.intervals[c.intervals.length - 1] === 10 || c.intervals[c.intervals.length - 1] === 11;
              return false;
            });
            if (filtered.length > 0) validCells = filtered;
          } else if (requireEnd5th && arpeggioMode === 'triad') {
            const filtered = validCells.filter(c => c.notes && c.notes[c.notes.length - 1].degIdx === 2);
            if (filtered.length > 0) validCells = filtered;
          }

          const cell = validCells[Math.floor(Math.random() * validCells.length)];
          
          let bestBaseOctave = tabView === 'bass' ? 48 : 60;
          let minDistance = 999;
          for (let octBase of (tabView === 'bass' ? [36, 48] : [48, 60, 72])) {
            const candidateRoot = octBase + chordInfo.rootPitch;
            const dist = Math.abs(candidateRoot - prevPitch);
            if (dist < minDistance) {
              minDistance = dist;
              bestBaseOctave = octBase;
            }
          }

          let abcTokens = [];

          const appendNote = (semiOffset) => {
            let p = bestBaseOctave + chordInfo.rootPitch + semiOffset;
            while (p < SAFE_MIN) p += 12;
            while (p > SAFE_MAX) p -= 12;
            
            if (p === prevPitch) p = (p + 12 <= SAFE_MAX) ? p + 12 : (p - 12 >= SAFE_MIN ? p - 12 : p);
            
            prevPitch = p;
            const abc = midiToAbcByKey(p, keySig, accRef);
            const deg = getExactDegree(p % 12, chordInfo.rootPitch, chordInfo.isV7);
            degreeTokensOut.push(deg || "·");
            
            allTabNotes.push({
              midi: p,
              guitar: calcBestGuitarTab(p, prevGuitarFretRef),
              bass: calcBestBassTab(p, prevBassFretRef)
            });
            return abc;
          };

          // ★V7のアプローチ（オルタード、コンディミ）が選択されている場合はそのまま適用
          if (cell.intervals) {
            cell.intervals.forEach(semi => {
              let actualSemi = semi;
              if (v7Approach === 'condim' && semi === 8) actualSemi = 9;
              abcTokens.push(appendNote(actualSemi));
            });
          } else {
            // トライアド / UST モードに応じた度数変換
            const notesToUse = cell.notes || [{degIdx:0,oct:0},{degIdx:1,oct:0},{degIdx:2,oct:0},{degIdx:3,oct:0}]; 
            notesToUse.forEach(nSpec => {
              let actualDegIdx = nSpec.degIdx;
              let actualOct = nSpec.oct;

              if (arpeggioMode === 'triad' && actualDegIdx === 3) {
                // 7th -> Root(1oct上) に置換
                actualDegIdx = 0;
                actualOct += 1;
              } else if (arpeggioMode === 'ust' && actualDegIdx === 0) {
                // Root -> 9th (degIdx:4) に置換
                actualDegIdx = 4; 
              }

              const semi = chordInfo.basicOffsets[actualDegIdx] + (actualOct * 12);
              abcTokens.push(appendNote(semi));
            });
          }

          switch (cell.pattern) {
            case "z_8_88": return `z${abcTokens[0]} ${abcTokens[1]}${abcTokens[2]}`;
            case "z8_88": return `z${abcTokens[0]} ${abcTokens[1]}${abcTokens[2]}`;
            case "88_trip": return `${abcTokens[0]}${abcTokens[1]} (3${abcTokens[2]}${abcTokens[3]}${abcTokens[4]}`;
            case "trip_88": return `(3${abcTokens[0]}${abcTokens[1]}${abcTokens[2]} ${abcTokens[3]}${abcTokens[4]}`;
            case "4_88": return `${abcTokens[0]}2 ${abcTokens[1]}${abcTokens[2]}`;
            case "88_4": return `${abcTokens[0]}${abcTokens[1]} ${abcTokens[2]}2`;
            case "4_4": return `${abcTokens[0]}2 ${abcTokens[1]}2`;
            case "8z_z8": return `${abcTokens[0]}z z${abcTokens[1]}`;
            case "trip_trip": return `(3${abcTokens[0]}${abcTokens[1]}${abcTokens[2]} (3${abcTokens[3]}${abcTokens[4]}${abcTokens[5]}`;
            case "88_88": default: return `${abcTokens[0]}${abcTokens[1]} ${abcTokens[2]}${abcTokens[3]}`;
          }
        };

        for (let i = 0; i < execPlan.length; i += 2) {
          const plan1 = execPlan[i];
          const plan2 = execPlan[i+1];

          const info1 = getChordToneInfo(plan1.chordStr);
          const info2 = getChordToneInfo(plan2.chordStr);

          let accV1 = {};
          let accComp = {};

          if (plan1.chordStr !== plan2.chordStr) {
            compingStr += `${getPianoVoicing(plan1.chordStr, keySig, accComp, 4)} ${getPianoVoicing(plan2.chordStr, keySig, accComp, 4)} | `;
          } else {
            compingStr += `${getPianoVoicing(plan1.chordStr, keySig, accComp, 4)} ${getPianoVoicing(plan1.chordStr, keySig, accComp, 4)} | `;
          }

          let degreeTokens = [];
          let half1Str = `"${plan1.chordStr}"` + realizeGiantCell(JAZZ_GIANT_HALF_CELLS_BEAT12, info1, accV1, degreeTokens, plan1.forceStart3rd, plan1.forceEnd7th, plan1.forceEnd5th) + " ";
          
          let half2Str = plan1.chordStr !== plan2.chordStr ? `"${plan2.chordStr}"` : "";

          // 最終小節の終わり
          if (i >= execPlan.length - 2) {
            // USTモード時は最後の音も9thにする
            let offset = arpeggioMode === 'ust' ? info2.basicOffsets[4] : 0; 
            let finalRoot = (tabView === 'bass' ? 48 : 60) + info2.rootPitch + offset;
            if (finalRoot < SAFE_MIN) finalRoot += 12;
            const finalAbc = midiToAbcByKey(finalRoot, keySig, accV1);
            degreeTokens.push(arpeggioMode === 'ust' ? "9" : "R");
            allTabNotes.push({ midi: finalRoot, guitar: calcBestGuitarTab(finalRoot, prevGuitarFretRef), bass: calcBestBassTab(finalRoot, prevBassFretRef) });
            half2Str += `${finalAbc}4`;
          } else {
            let cell2List;
            if (info2.isV7 && v7Approach !== 'chordtone') {
              // オルタード/コンディミが選ばれていれば、モードに関わらず強制適用
              cell2List = v7Approach === 'altered' ? V7_ALTERED_CELLS : V7_CONDIM_CELLS;
            } else {
              // 通常のアプローチ（モードによる自動変換が適用される）
              cell2List = JAZZ_GIANT_HALF_CELLS_BEAT34;
            }
            half2Str += realizeGiantCell(cell2List, info2, accV1, degreeTokens, plan2.forceStart3rd, plan2.forceEnd7th, plan2.forceEnd5th);
          }

          const measureMelodyStr = `${half1Str}${half2Str} | `;
          const measureLyricStr = degreeTokens.join(" ") + " | ";

          fullLines.push({ melody: measureMelodyStr, lyric: measureLyricStr });
          audioMelody += measureMelodyStr;

          if ((i / 2 + 1) % 4 === 0) {
            audioMelody += "\n";
            compingStr += "\n";
          }
        }

        setTabNotesData(allTabNotes);

        let header = "X: 1\n";
        header += `T: ${currentSong.title || "Adlib solo etude for standards"}\n`;
        header += "M: 4/4\n";
        header += "L: 1/8\n";
        header += `K: ${keySig}\n`;
        header += "%%staffwidth 820\n";
        header += "%%stretchlast 1\n";
        header += "%%gchord 28\n";

        let scoreBody = "";
        for (let i = 0; i < fullLines.length; i += 4) {
          let lineMelody = "";
          let lineLyric = "";
          for (let j = 0; j < 4; j++) {
            if (fullLines[i + j]) {
              lineMelody += fullLines[i + j].melody;
              lineLyric += fullLines[i + j].lyric;
            }
          }
          scoreBody += lineMelody + "\n";
          if (showDegrees) {
            scoreBody += "w: " + lineLyric + "\n";
          }
        }

        setAbcString(header + scoreBody);

        let audioH = "X: 1\n";
        audioH += "M: 4/4\n";
        audioH += "L: 1/8\n";
        audioH += `Q: 1/4=${bpm}\n`;
        audioH += `K: ${keySig}\n`;
        audioH += "%%staves (1 2)\n";
        audioH += "V: 1 clef=treble\n%%MIDI program 26\n%%MIDI control 7 115\n"; 
        audioH += "V: 2 clef=treble\n%%MIDI program 0\n%%MIDI control 7 70\n";   

        setAudioAbcString(audioH + "[V: 1]\n" + audioMelody + "[V: 2]\n" + compingStr);
        setBackingAbcString(audioH + "[V: 1]\n%%MIDI control 7 0\n" + audioMelody + "[V: 2]\n" + compingStr);
      };

      const selectSong = (song) => {
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSong(song);
        setIsModalOpen(false);
      };

      return (
        <div className="min-h-screen bg-slate-50 print:bg-white text-slate-800 p-4 md:p-8 print:p-0">
          <div className="max-w-6xl mx-auto space-y-6 print:space-y-0">
            
            {/* ヘッダー */}
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4 print:hidden">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-blue-600 text-white rounded-xl shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">Adlib solo etude for standards</h1>
                  <p className="text-xs text-slate-500">アルペジオによるソロエチュード</p>
                </div>
              </div>

              {/* TAB併記切り替え */}
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500">TAB譜:</span>
                <div className="flex bg-slate-200/80 p-1 rounded-xl gap-1 border border-slate-300">
                  <button
                    onClick={() => setTabView('guitar')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'guitar' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ギターTAB (6〜20F)
                  </button>
                  <button
                    onClick={() => setTabView('bass')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'bass' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ベースTAB (4弦・8vb)
                  </button>
                  <button
                    onClick={() => setTabView('none')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'none' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    五線譜のみ
                  </button>
                </div>
              </div>
            </header>

            {/* コントロールバー */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 print:hidden">
              
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                  アルペジオ・モード
                </label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button
                    onClick={() => setArpeggioMode('triad')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${arpeggioMode === 'triad' ? 'bg-emerald-50 border-emerald-500 text-emerald-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    トライアド
                  </button>
                  <button
                    onClick={() => setArpeggioMode('7th')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${arpeggioMode === '7th' ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    7th含む
                  </button>
                  <button
                    onClick={() => setArpeggioMode('ust')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${arpeggioMode === 'ust' ? 'bg-purple-50 border-purple-500 text-purple-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    UST(3,5,7,9)
                  </button>
                </div>
              </div>

              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                  V7 (ドミナント) アプローチ
                </label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button
                    onClick={() => setV7Approach('chordtone')}
                    className={`py-2 px-1 text-[11px] rounded-lg font-medium border text-center transition ${v7Approach === 'chordtone' ? 'bg-amber-50 border-amber-500 text-amber-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    アルペジオ
                  </button>
                  <button
                    onClick={() => setV7Approach('altered')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'altered' ? 'bg-amber-50 border-amber-500 text-amber-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    オルタード
                  </button>
                  <button
                    onClick={() => setV7Approach('condim')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'condim' ? 'bg-amber-50 border-amber-500 text-amber-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    コンディミ
                  </button>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-bold text-slate-600 uppercase tracking-wider">
                    テンポ: {bpm} BPM
                  </label>
                  <span className="text-xs text-slate-500 font-medium">{measureCount} 小節</span>
                </div>
                <input 
                  type="range" min="80" max="220" step="5" value={bpm} 
                  onChange={(e) => setBpm(Number(e.target.value))} 
                  className="w-full accent-blue-600 h-2 bg-slate-100 rounded-lg cursor-pointer"
                />
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg border border-slate-200 transition"
                >
                  スタンダード曲から選択 ({currentSong.title})
                </button>
              </div>

              <div className="flex flex-col justify-end">
                <button
                  onClick={generateEtude}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition active:scale-[0.98] flex items-center justify-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path></svg>
                  エチュードを再生成
                </button>
              </div>
            </div>

            {/* コード進行編集アコーディオン */}
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 print:hidden">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-bold text-slate-600 uppercase tracking-wider">
                  コード進行 ({measureCount} 小節)
                </span>
                <span className="text-[11px] text-slate-400">※「Bmaj7 D7」のようにスペース区切りで2拍ずつのコードチェンジになります</span>
              </div>
              <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5 max-h-32 overflow-y-auto pr-1 custom-scrollbar">
                {Array.from({ length: measureCount }).map((_, i) => (
                  <div key={i} className="flex flex-col">
                    <span className="text-[9px] text-slate-400 font-mono pl-1">{i + 1}</span>
                    <input
                      type="text"
                      value={chords[i] || ""}
                      onChange={(e) => {
                        const newC = [...chords];
                        newC[i] = e.target.value;
                        setChords(newC);
                      }}
                      placeholder="Cmaj7"
                      className="border border-slate-200 px-2 py-1 rounded text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                ))}
              </div>
            </div>

            {/* 楽譜 & プレイヤーカード */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print:border-none print:shadow-none">
              <div className="bg-slate-50 border-b border-slate-200 px-4 py-3 flex flex-wrap justify-between items-center gap-3 print:hidden">
                <div className="flex items-center gap-4">
                  <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                    <input
                      type="checkbox"
                      checked={isBackingOnly}
                      onChange={(e) => setIsBackingOnly(e.target.checked)}
                      className="w-4 h-4 text-blue-600 rounded border-slate-300"
                    />
                    <span>ピアノ伴奏のみ再生</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                    <input
                      type="checkbox"
                      checked={showDegrees}
                      onChange={(e) => {
                        setShowDegrees(e.target.checked);
                        generateEtude();
                      }}
                      className="w-4 h-4 text-amber-600 rounded border-slate-300"
                    />
                    <span>度数注記（五線とTABの間に表示）</span>
                  </label>
                </div>

                <div className="flex items-center gap-3">
                  <div ref={audioRef}></div>
                  <button
                    onClick={() => window.print()}
                    className="px-3 py-1.5 text-xs bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    PDFで保存
                  </button>
                </div>
              </div>

              {/* 楽譜描画エリア */}
              <div className="p-4 md:p-8 flex justify-center bg-white overflow-x-auto custom-scrollbar">
                <div className="w-full max-w-[860px]">
                  <div id="paper" className="w-full"></div>
                  <div id="audio-paper" style={{ position: 'absolute', top: '-9999px', visibility: 'hidden' }}></div>
                </div>
              </div>
            </div>

          </div>

          {/* スタンダード曲選択モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[80vh] overflow-hidden flex flex-col">
                <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 text-sm">スタンダード曲を選択</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="p-3 overflow-y-auto custom-scrollbar space-y-1.5">
                  {standardSongs.map((song, idx) => (
                    <button
                      key={idx}
                      onClick={() => selectSong(song)}
                      className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-blue-50 hover:text-blue-700 transition flex justify-between items-center group text-xs font-semibold text-slate-700"
                    >
                      <div className="flex items-center gap-2">
                        <span>{song.title}</span>
                        <span className="text-[10px] text-slate-400 font-mono">({song.key})</span>
                      </div>
                      <span className="text-[11px] px-2 py-0.5 bg-slate-100 group-hover:bg-blue-100 text-slate-500 group-hover:text-blue-700 rounded-md">
                        {song.measures} 小節
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

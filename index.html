<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Solo Etude - True Key & Zero Open Strings</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-audio.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js"></script>

  <style>
    .abcjs-css-warning { display: none !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .abcjs-note { fill: #0f172a; }
    .abcjs-staff { stroke: #64748b; }
    .abcjs-highlight { fill: #2563eb !important; stroke: #2563eb !important; }
    .abcjs-tempo { display: none !important; }

    .abcjs-chord { font-size: 16px !important; font-weight: 800 !important; fill: #0f172a !important; }
    .abcjs-annotation { font-size: 11px !important; font-weight: 700 !important; fill: #b45309 !important; font-family: sans-serif !important; }

    #paper { padding-bottom: 20px; }
    #paper svg { 
      overflow: visible !important; 
      margin-bottom: 30px !important; 
      width: 100% !important;
      height: auto !important;
    }

    .abcjs-inline-audio { margin: 0; padding: 10px; display: flex; align-items: center; gap: 8px; justify-content: center; }
    .abcjs-inline-audio .abcjs-btn {
       background-color: #f1f5f9 !important;
       border: 1px solid #cbd5e1 !important;
       border-radius: 8px !important;
       color: #334155 !important;
       width: 36px !important;
       height: 36px !important;
       cursor: pointer;
       display: inline-flex !important;
       align-items: center;
       justify-content: center;
       margin: 0 4px;
       padding: 0 !important;
    }
    .abcjs-inline-audio .abcjs-btn:hover { background-color: #e2e8f0 !important; }
    .abcjs-inline-audio .abcjs-btn svg { width: 18px !important; height: 18px !important; fill: #334155 !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const standardSongs = [
      {
        title: "Autumn Leaves",
        key: "Gm", // 調号: Bb, Eb
        measures: 32,
        chords: [
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Cm7", "F7", "Bbmaj7", "Ebmaj7", "Am7b5", "D7", "Gm7", "Gm7",
          "Am7b5", "D7", "Gm7", "Gm7", "Cm7", "F7", "Bbmaj7", "Ebmaj7",
          "Am7b5", "D7", "Gm7 C7", "Fm7 Bb7", "Ebmaj7", "Am7b5 D7", "Gm7", "Gm7"
        ]
      },
      {
        title: "All The Things You Are",
        key: "Ab", // 調号: Bb, Eb, Ab, Db
        measures: 36,
        chords: [
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "G7", "Cmaj7", "Cmaj7",
          "Cm7", "Fm7", "Bb7", "Ebmaj7", "Abmaj7", "D7", "Gmaj7", "Gmaj7",
          "Am7", "D7", "Gmaj7", "Gmaj7", "F#m7b5", "B7", "Emaj7", "C7#5",
          "Fm7", "Bbm7", "Eb7", "Abmaj7", "Dbmaj7", "Dbm7", "Cm7", "Bdim7",
          "Bbm7", "Eb7", "Abmaj7", "Abmaj7"
        ]
      },
      {
        title: "Donna Lee",
        key: "Ab",
        measures: 32,
        chords: [
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Bbm7", "Bb7", "Bb7",
          "Bbm7", "Eb7", "Abmaj7", "F7", "Bbm7", "C7", "Fm7", "C7",
          "Fm7", "Fm7", "C7", "C7", "Fm7", "Fm7", "Eb7", "Eb7",
          "Abmaj7", "Abmaj7", "F7", "F7", "Bbm7", "Edim7", "Abmaj7 F7", "Bbm7 Eb7"
        ]
      },
      {
        title: "Stella by Starlight",
        key: "Bb", // 調号: Bb, Eb
        measures: 32,
        chords: [
          "Em7b5", "A7", "Cm7", "F7", "Fm7", "Bb7", "Ebmaj7", "Ebmaj7",
          "Ab7", "Ab7", "Bbmaj7", "Bbmaj7", "Em7b5", "A7", "Dm7", "Dm7",
          "Bbm7", "Eb7", "Fmaj7", "Fmaj7", "Em7b5", "A7", "Am7b5", "D7",
          "G7", "G7", "Cm7", "Cm7", "Ab7", "Ab7", "Bbmaj7", "Bbmaj7"
        ]
      },
      {
        title: "There Will Never Be Another You",
        key: "Eb", // 調号: Bb, Eb, Ab
        measures: 32,
        chords: [
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Abmaj7", "Ebmaj7", "Ebmaj7", "Fm7", "Fm7", "Bb7", "Bb7",
          "Ebmaj7", "Ebmaj7", "Dm7b5", "G7", "Cm7", "Cm7", "Bbm7", "Eb7",
          "Abmaj7", "Db7", "Ebmaj7 C7", "Fm7 Bb7", "Ebmaj7", "Fm7", "Bb7", "Bb7"
        ]
      },
      {
        title: "Giant Steps",
        key: "B", // 調号: ♯5つ
        measures: 16,
        chords: [
          "Bmaj7 D7", "Gmaj7 Bb7", "Ebmaj7", "Am7 D7",
          "Gmaj7 Bb7", "Ebmaj7 F#7", "Bmaj7", "Fm7 Bb7",
          "Ebmaj7", "Am7 D7", "Gmaj7", "C#m7 F#7",
          "Bmaj7", "Fm7 Bb7", "Ebmaj7", "C#m7 F#7"
        ]
      }
    ];

    const PITCH_CLASSES = {
      'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
      'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8,
      'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
    };

    // 調号に応じたデフォルトのナチュラル／変化音マップ
    // 調号に含まれる音はフラット記号を付けずに大文字アルファベットだけでOK
    const KEY_SIGNATURE_FLATS = {
      'Gm': ['B', 'E'],
      'Bb': ['B', 'E'],
      'Eb': ['B', 'E', 'A'],
      'Ab': ['B', 'E', 'A', 'D'],
      'F': ['B'],
      'C': [],
      'B': []
    };

    function App() {
      const [measureCount, setMeasureCount] = useState(32);
      const [bpm, setBpm] = useState(130);
      const [chords, setChords] = useState(Array(64).fill(""));
      const [currentSong, setCurrentSong] = useState(standardSongs[0]);
      const [v7Approach, setV7Approach] = useState("altered");
      const [tabView, setTabView] = useState("guitar");
      const [showDegrees, setShowDegrees] = useState(true);
      
      const [abcString, setAbcString] = useState("");
      const [audioAbcString, setAudioAbcString] = useState("");
      const [backingAbcString, setBackingAbcString] = useState("");
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      const [noteTabPositions, setNoteTabPositions] = useState([]);
      
      const [abcjsLoaded, setAbcjsLoaded] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const audioRef = useRef(null);
      const synthRef = useRef(null);

      useEffect(() => {
        const song = standardSongs[0];
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSong(song);
      }, []);

      useEffect(() => {
        if (window.ABCJS) {
          setAbcjsLoaded(true);
          return;
        }
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js";
        script.async = true;
        script.onload = () => setAbcjsLoaded(true);
        document.body.appendChild(script);
      }, []);

      useEffect(() => {
        if (abcjsLoaded && chords[0] !== "" && abcString === "") {
          generateEtude();
        }
      }, [abcjsLoaded, chords]);

      // 譜面レンダリング＆開放弦ゼロTABオーバーレイ同期
      useEffect(() => {
        if (abcjsLoaded && abcString && window.ABCJS) {
          // 五線譜（abcjs正規描画）
          window.ABCJS.renderAbc("paper", abcString, {
            responsive: "resize",
            add_classes: true,
            paddingtop: 25,
            paddingbottom: 30,
            paddingleft: 0,
            paddingright: 0,
            staffwidth: 820
          });

          // SVG内の全音符要素の位置を取得し、直下に開放弦ゼロのTABを精密同期注入
          setTimeout(() => {
            attachZeroOpenTab();
          }, 50);

          const currentAudioString = isBackingOnly ? backingAbcString : audioAbcString;
          const visualObjForAudio = window.ABCJS.renderAbc("audio-paper", currentAudioString, {
            add_classes: true
          })[0];

          if (window.ABCJS.synth.supportsAudio() && audioRef.current) {
            if (synthRef.current) {
              synthRef.current.pause();
              synthRef.current.disable(true);
            }
            audioRef.current.innerHTML = "";

            const cursorControl = {
              onStart: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              },
              onEvent: function(ev) {
                if (!ev || (ev.measureStart && ev.left === null)) return;
                const displaySvg = document.querySelector("#paper svg");
                const audioSvg = document.querySelector("#audio-paper svg");
                if (!displaySvg || !audioSvg) return;

                displaySvg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));

                if (ev.elements && Array.isArray(ev.elements)) {
                  const audioNotes = Array.from(audioSvg.querySelectorAll(".abcjs-v0 .abcjs-note, .abcjs-v0 .abcjs-rest"));
                  const displayNotes = Array.from(displaySvg.querySelectorAll(".abcjs-note, .abcjs-rest"));

                  ev.elements.forEach(element => {
                    if (!element) return;
                    let index = audioNotes.indexOf(element);
                    if (index === -1 && element.closest) {
                      const parent = element.closest('.abcjs-note, .abcjs-rest');
                      if (parent) index = audioNotes.indexOf(parent);
                    }
                    if (index !== -1 && displayNotes[index]) {
                      displayNotes[index].classList.add("abcjs-highlight");
                    }
                  });
                }
              },
              onFinished: function() {
                const svg = document.querySelector("#paper svg");
                if (svg) svg.querySelectorAll(".abcjs-highlight").forEach(n => n.classList.remove("abcjs-highlight"));
              }
            };

            const synthControl = new window.ABCJS.synth.SynthController();
            synthControl.load(audioRef.current, cursorControl, {
              displayLoop: true,
              displayRestart: true,
              displayPlay: true,
              displayProgress: true,
              displayWarp: false 
            });

            synthControl.setTune(visualObjForAudio, false, { chordsOff: true }).catch(console.error);
            synthRef.current = synthControl;
          }
        }
      }, [abcString, audioAbcString, backingAbcString, isBackingOnly, abcjsLoaded, tabView, noteTabPositions]);

      // 【完全開放弦ゼロ】TAB譜オーバーレイ処理
      const attachZeroOpenTab = () => {
        if (tabView === 'none') return;
        const svg = document.querySelector("#paper svg");
        if (!svg) return;

        // 既存のTABレイヤーを削除
        const existingTab = svg.querySelector("#custom-tab-layer");
        if (existingTab) existingTab.remove();

        const tabGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        tabGroup.setAttribute("id", "custom-tab-layer");

        const noteElements = svg.querySelectorAll(".abcjs-note");
        const isBass = tabView === 'bass';
        const stringCount = isBass ? 4 : 6;
        const stringGap = 12;

        // 各段（システム）ごとにTABの平行線を描画
        const staffLines = svg.querySelectorAll(".abcjs-staff");
        staffLines.forEach((staff) => {
          const bbox = staff.getBBox();
          const tabTop = bbox.y + bbox.height + 35;

          // 平行線
          for (let s = 0; s < stringCount; s++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", bbox.x);
            line.setAttribute("y1", tabTop + s * stringGap);
            line.setAttribute("x2", bbox.x + bbox.width);
            line.setAttribute("y2", tabTop + s * stringGap);
            line.setAttribute("stroke", "#cbd5e1");
            line.setAttribute("stroke-width", "1");
            tabGroup.appendChild(line);
          }

          // TAB文字
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", bbox.x + 5);
          text.setAttribute("y", tabTop + (isBass ? 22 : 32));
          text.setAttribute("font-size", "11");
          text.setAttribute("font-weight", "bold");
          text.setAttribute("fill", "#94a3b8");
          text.textContent = isBass ? "TAB(B)" : "TAB(G)";
          tabGroup.appendChild(text);
        });

        // 各音符の真下に開放弦ゼロのフレット番号を配置
        noteElements.forEach((noteEl, idx) => {
          const tabData = noteTabPositions[idx];
          if (!tabData) return;

          const bbox = noteEl.getBBox();
          const noteX = bbox.x + bbox.width / 2;
          
          // 最も近い段のTAB基準位置を探索
          let closestTabY = 0;
          let minDist = 9999;
          staffLines.forEach(staff => {
            const sBox = staff.getBBox();
            const dist = Math.abs(bbox.y - sBox.y);
            if (dist < minDist) {
              minDist = dist;
              closestTabY = sBox.y + sBox.height + 35;
            }
          });

          const pos = isBass ? tabData.bass : tabData.guitar;
          const numY = closestTabY + (pos.string - 1) * stringGap;

          // 数字背景白マスク
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", noteX - 7);
          rect.setAttribute("y", numY - 6.5);
          rect.setAttribute("width", 14);
          rect.setAttribute("height", 13);
          rect.setAttribute("fill", "#ffffff");
          rect.setAttribute("rx", "2");
          tabGroup.appendChild(rect);

          // フレット番号（1フレット以上・開放弦0は絶対に出ない）
          const fretText = document.createElementNS("http://www.w3.org/2000/svg", "text");
          fretText.setAttribute("x", noteX);
          fretText.setAttribute("y", numY + 4);
          fretText.setAttribute("text-anchor", "middle");
          fretText.setAttribute("font-size", "12");
          fretText.setAttribute("font-weight", "bold");
          fretText.setAttribute("fill", "#0f172a");
          fretText.textContent = pos.fret;
          tabGroup.appendChild(fretText);
        });

        svg.appendChild(tabGroup);
      };

      // 正確な度数判定
      const getAccurateDegreeLabel = (midi, chordStr) => {
        if (!chordStr) return "";
        const match = chordStr.match(/^[A-G][#b]?/);
        if (!match) return "";
        const root = match[0];
        const rootPitch = PITCH_CLASSES[root];
        if (rootPitch === undefined) return "";

        const semitones = (midi % 12 - rootPitch + 12) % 12;
        const type = chordStr.substring(root.length);

        const isMinor = type.includes('m') && !type.includes('maj');
        const isDim = type.includes('dim') || type.includes('m7b5');
        const isMajor = type.includes('maj') || type.includes('M7') || type.includes('△');
        const isV7 = type.includes('7') && !isMinor && !isMajor && !isDim;

        switch (semitones) {
          case 0:  return "R";
          case 1:  return isV7 ? "♭9" : "";
          case 2:  return "9";
          case 3:  return (isMinor || isDim) ? "♭3" : (isV7 ? "♯9" : "");
          case 4:  return !isMinor ? "3" : "";
          case 5:  return isMinor ? "11" : "";
          case 6:  return isDim ? "♭5" : (isV7 ? "♯11" : "");
          case 7:  return !isDim ? "5" : "";
          case 8:  return isV7 ? "♭13" : "";
          case 9:  return isDim ? "6" : "13";
          case 10: return (isV7 || isMinor || isDim) ? "7" : "";
          case 11: return isMajor ? "△7" : "";
          default: return "";
        }
      };

      // 【開放弦ゼロの厳密ポジション計算】
      // フレット範囲を 2〜15フレットに限定し、0フレット（開放弦）を絶対に排除
      const calcZeroOpenPosition = (midi) => {
        // ギター: 1弦=64(E4), 2弦=59(B3), 3弦=55(G3), 4弦=50(D3), 5弦=45(A2), 6弦=40(E2)
        const guitarTunings = [64, 59, 55, 50, 45, 40];
        let bestGt = null;
        let minDiffGt = 999;

        for (let s = 0; s < guitarTunings.length; s++) {
          const fret = midi - guitarTunings[s];
          // ★0フレット（開放弦）を禁止し、2フレット以上15フレット以下に限定
          if (fret >= 2 && fret <= 15) {
            const diff = Math.abs(fret - 7); // 5〜8フレット付近を最優先
            if (diff < minDiffGt) {
              minDiffGt = diff;
              bestGt = { string: s + 1, fret };
            }
          }
        }
        if (!bestGt) bestGt = { string: 1, fret: Math.max(1, midi - 64) };

        // ベース (8vb: 実音より12半音下げ): 1弦=43(G2), 2弦=38(D2), 3弦=33(A1), 4弦=28(E1)
        const bassMidi = midi - 12;
        const bassTunings = [43, 38, 33, 28];
        let bestBs = null;
        let minDiffBs = 999;

        for (let s = 0; s < bassTunings.length; s++) {
          const fret = bassMidi - bassTunings[s];
          if (fret >= 2 && fret <= 15) {
            const diff = Math.abs(fret - 5);
            if (diff < minDiffBs) {
              minDiffBs = diff;
              bestBs = { string: s + 1, fret };
            }
          }
        }
        if (!bestBs) bestBs = { string: 1, fret: Math.max(1, bassMidi - 43) };

        return { guitar: bestGt, bass: bestBs };
      };

      // 【正しい調号反映】調号に含まれる音には臨時記号を付けない！
      const midiToAbcAccurateKey = (midi, keySig, measureAccRef) => {
        const flatsInKey = KEY_SIGNATURE_FLATS[keySig] || [];

        // 12半音の音名マッピング（フラットキー基準）
        // 0:C, 1:Db, 2:D, 3:Eb, 4:E, 5:F, 6:Gb, 7:G, 8:Ab, 9:A, 10:Bb, 11:B
        const pitchClass = midi % 12;
        const octave = Math.floor(midi / 12) - 1;

        let baseName = "";
        let requiresAccidental = "";

        switch (pitchClass) {
          case 0:  baseName = "C"; break;
          case 1:  baseName = "D"; requiresAccidental = "_"; break;
          case 2:  baseName = "D"; if (flatsInKey.includes('D')) requiresAccidental = "="; break;
          case 3:  baseName = "E"; if (!flatsInKey.includes('E')) requiresAccidental = "_"; break; // 調号にあれば記号不要！
          case 4:  baseName = "E"; if (flatsInKey.includes('E')) requiresAccidental = "="; break;
          case 5:  baseName = "F"; break;
          case 6:  baseName = "G"; requiresAccidental = "_"; break;
          case 7:  baseName = "G"; break;
          case 8:  baseName = "A"; if (!flatsInKey.includes('A')) requiresAccidental = "_"; break;
          case 9:  baseName = "A"; if (flatsInKey.includes('A')) requiresAccidental = "="; break;
          case 10: baseName = "B"; if (!flatsInKey.includes('B')) requiresAccidental = "_"; break; // ★シ♭は調号にあれば記号なしの「B」！
          case 11: baseName = "B"; if (flatsInKey.includes('B')) requiresAccidental = "="; break;
        }

        let abc = baseName;
        if (octave === 3) abc = baseName + ",";
        else if (octave === 4) abc = baseName;
        else if (octave === 5) abc = baseName.toLowerCase();
        else if (octave === 6) abc = baseName.toLowerCase() + "'";

        const key = baseName + octave;
        const currentAcc = measureAccRef[key];
        
        let prefix = "";
        if (requiresAccidental !== "") {
          if (currentAcc !== requiresAccidental) {
            prefix = requiresAccidental;
            measureAccRef[key] = requiresAccidental;
          }
        } else {
          // 記号不要だが、同じ小節内で以前に変化記号が付けられていたらナチュラルで戻す
          if (currentAcc !== undefined && currentAcc !== "") {
            prefix = "=";
            measureAccRef[key] = "";
          }
        }

        return prefix + abc;
      };

      const clampBass = (m) => {
        let n = m;
        while (n < 28) n += 12;
        while (n > 48) n -= 12;
        return n;
      };

      // フレーズ生成エンジン
      const generateEtude = () => {
        let displayMelody = "";
        let audioMelody = "";
        let compingStr = "";
        let bassStr = "";
        let tabPosList = [];

        const keySig = currentSong.key || "C";

        // 開放弦ゼロのため音域を確実にコントロール (A3=57 〜 C6=84)
        const POS_MIN = 57; 
        const POS_MAX = 84;

        let curMidi = 65; // F4

        for (let m = 0; m < measureCount; m++) {
          const chordStr = chords[m] || "Cmaj7";
          const chordList = chordStr.split(/\s+/).filter(c => c.length > 0);
          const firstChord = chordList[0] || "Cmaj7";
          const match = firstChord.match(/^[A-G][#b]?/);
          const rootMidi = match ? (PITCH_CLASSES[match[0]] || 0) : 0;
          const isV7 = firstChord.includes('7') && !firstChord.includes('maj') && !firstChord.includes('m');

          let accV1 = {};
          let accV2 = {};
          let accV3 = {};

          displayMelody += `"${firstChord}"`;
          audioMelody += `"${firstChord}"`;

          // バッキング
          const bassRoot = 36 + rootMidi;
          compingStr += `[${midiToAbcAccurateKey(52 + rootMidi, keySig, accV2)}${midiToAbcAccurateKey(55 + rootMidi, keySig, accV2)}${midiToAbcAccurateKey(59 + rootMidi, keySig, accV2)}]8 | `;
          bassStr += `${midiToAbcAccurateKey(clampBass(bassRoot), keySig, accV3)}2 ${midiToAbcAccurateKey(clampBass(bassRoot + 7), keySig, accV3)}2 ${midiToAbcAccurateKey(clampBass(bassRoot + 4), keySig, accV3)}2 ${midiToAbcAccurateKey(clampBass(bassRoot + 5), keySig, accV3)}2 | `;

          const pattern = m % 4;

          const formatNote = (midi, duration = "") => {
            let safeMidi = midi;
            while (safeMidi > POS_MAX) safeMidi -= 12;
            while (safeMidi < POS_MIN) safeMidi += 12;

            tabPosList.push(calcZeroOpenPosition(safeMidi));

            const abc = midiToAbcAccurateKey(safeMidi, keySig, accV1);
            const degree = showDegrees ? getAccurateDegreeLabel(safeMidi, firstChord) : "";
            const annot = degree ? `_"${degree}"` : "";

            return { display: `${annot}${abc}${duration}`, audio: `${abc}${duration}` };
          };

          if (pattern === 0) {
            let baseP = 58 + rootMidi;
            while (baseP < POS_MIN) baseP += 12;
            while (baseP > 67) baseP -= 12;

            let n1 = formatNote(baseP);
            let n2 = formatNote(baseP + 4);
            let n3 = formatNote(baseP + 7);
            let n4 = formatNote(baseP + 10);
            let n5 = formatNote(baseP + 14);
            let n6 = formatNote(baseP + 12);
            let n7 = formatNote(baseP + 9);
            let n8 = formatNote(baseP + 7);

            displayMelody += `${n1.display}${n2.display} ${n3.display}${n4.display} ${n5.display}${n6.display} ${n7.display}${n8.display} | `;
            audioMelody += `${n1.audio}${n2.audio} ${n3.audio}${n4.audio} ${n5.audio}${n6.audio} ${n7.audio}${n8.audio} | `;
            curMidi = baseP + 7;

          } else if (pattern === 1) {
            const target = curMidi;
            const t1 = formatNote(target + 1);
            const t2 = formatNote(target);
            const t3 = formatNote(target - 1);

            displayMelody += `(3${t1.display}${t2.display}${t3.display} `;
            audioMelody += `(3${t1.audio}${t2.audio}${t3.audio} `;

            let d1 = formatNote(target - 2);
            let d2 = formatNote(target - 4);
            let d3 = formatNote(target - 5);
            let d4 = formatNote(target - 7);
            let d5 = formatNote(target - 9);

            displayMelody += `${d1.display}${d2.display} ${d3.display}${d4.display} ${d5.display}z | `;
            audioMelody += `${d1.audio}${d2.audio} ${d3.audio}${d4.audio} ${d5.audio}z | `;
            curMidi = target - 9;

          } else if (pattern === 2) {
            if (isV7) {
              const tension = v7Approach === 'altered' ? (60 + rootMidi + 1) : (60 + rootMidi + 3);
              const third = 60 + rootMidi + 4;

              const n1 = formatNote(tension);
              const n2 = formatNote(tension - 1);
              const n3 = formatNote(third + 1);
              const n4 = formatNote(third - 1);
              const n5 = formatNote(third, "2");

              displayMelody += `${n1.display}${n2.display} ${n3.display}${n4.display} ${n5.display} z2 | `;
              audioMelody += `${n1.audio}${n2.audio} ${n3.audio}${n4.audio} ${n5.audio} z2 | `;
              curMidi = third;
            } else {
              const n1 = formatNote(curMidi, "2");
              const t1 = formatNote(curMidi + 3);
              const t2 = formatNote(curMidi + 5);
              const t3 = formatNote(curMidi + 7);
              const n2 = formatNote(curMidi + 10, "2");

              displayMelody += `${n1.display} (3${t1.display}${t2.display}${t3.display} ${n2.display} | `;
              audioMelody += `${n1.audio} (3${t1.audio}${t2.audio}${t3.audio} ${n2.audio} | `;
              curMidi = curMidi + 10;
            }

          } else {
            let jump = curMidi < 70 ? curMidi + 12 : curMidi - 12;
            const n1 = formatNote(curMidi);
            const n2 = formatNote(jump);
            const c1 = formatNote(jump - 1);
            const c2 = formatNote(jump - 2);
            const c3 = formatNote(jump - 3);
            const n3 = formatNote(jump - 5, "2");

            displayMelody += `${n1.display}${n2.display} (3${c1.display}${c2.display}${c3.display} ${n3.display} z | `;
            audioMelody += `${n1.audio}${n2.audio} (3${c1.audio}${c2.audio}${c3.audio} ${n3.audio} z | `;
            curMidi = jump - 5;
          }

          if ((m + 1) % 4 === 0) {
            displayMelody += "\n";
            audioMelody += "\n";
            compingStr += "\n";
            bassStr += "\n";
          }
        }

        setNoteTabPositions(tabPosList);

        let header = "X: 1\n";
        header += `T: ${currentSong.title || "Jazz Solo Etude"}\n`;
        header += "M: 4/4\n";
        header += "L: 1/8\n";
        header += `K: ${keySig}\n`;
        header += "%%staffwidth 820\n";
        header += "%%stretchlast 1\n";
        header += "%%gchord 30\n";
        header += "%%annotationfont 11\n";
        setAbcString(header + displayMelody);

        let audioH = "X: 1\n";
        audioH += "M: 4/4\n";
        audioH += "L: 1/8\n";
        audioH += `Q: 1/4=${bpm}\n`;
        audioH += `K: ${keySig}\n`;
        audioH += "%%staves (1 2 3)\n";
        audioH += "V: 1 clef=treble\n%%MIDI program 26\n%%MIDI control 7 115\n";
        audioH += "V: 2 clef=treble\n%%MIDI program 0\n%%MIDI control 7 55\n";
        audioH += "V: 3 clef=bass\n%%MIDI program 32\n%%MIDI control 7 95\n";

        setAudioAbcString(audioH + "[V: 1]\n" + audioMelody + "[V: 2]\n" + compingStr + "[V: 3]\n" + bassStr);
        setBackingAbcString(audioH + "[V: 1]\n%%MIDI control 7 0\n" + audioMelody + "[V: 2]\n" + compingStr + "[V: 3]\n" + bassStr);
      };

      const selectSong = (song) => {
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSong(song);
        setIsModalOpen(false);
      };

      return (
        <div className="min-h-screen bg-slate-50 print:bg-white text-slate-800 p-4 md:p-8 print:p-0">
          <div className="max-w-6xl mx-auto space-y-6 print:space-y-0">
            
            {/* ヘッダー */}
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4 print:hidden">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-blue-600 text-white rounded-xl shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">Jazz Solo & TAB Etude</h1>
                  <p className="text-xs text-slate-500">正確な調号（二重♭の完全排除）・開放弦ゼロ（2フレット以上固定）</p>
                </div>
              </div>

              {/* TAB併記切り替え */}
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-500">TAB譜:</span>
                <div className="flex bg-slate-200/80 p-1 rounded-xl gap-1 border border-slate-300">
                  <button
                    onClick={() => setTabView('guitar')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'guitar' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ギターTAB (開放弦なし)
                  </button>
                  <button
                    onClick={() => setTabView('bass')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'bass' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    ベースTAB (8vb)
                  </button>
                  <button
                    onClick={() => setTabView('none')}
                    className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${tabView === 'none' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    五線譜のみ
                  </button>
                </div>
              </div>
            </header>

            {/* コントロールバー */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 print:hidden">
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                  V7 (ドミナント) アプローチ
                </label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button
                    onClick={() => setV7Approach('chordtone')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'chordtone' ? 'bg-amber-50 border-amber-500 text-amber-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    コードトーン
                  </button>
                  <button
                    onClick={() => setV7Approach('altered')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'altered' ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    オルタード
                  </button>
                  <button
                    onClick={() => setV7Approach('condim')}
                    className={`py-2 px-1 text-xs rounded-lg font-medium border text-center transition ${v7Approach === 'condim' ? 'bg-indigo-50 border-indigo-500 text-indigo-700 font-bold' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                  >
                    コンディミ
                  </button>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-bold text-slate-600 uppercase tracking-wider">
                    テンポ: {bpm} BPM (Key: {currentSong.key || "C"})
                  </label>
                  <span className="text-xs text-slate-500 font-medium">{measureCount} 小節</span>
                </div>
                <input 
                  type="range" min="80" max="220" step="5" value={bpm} 
                  onChange={(e) => setBpm(Number(e.target.value))} 
                  className="w-full accent-blue-600 h-2 bg-slate-100 rounded-lg cursor-pointer"
                />
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="w-full mt-1 px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg border border-slate-200 transition"
                >
                  スタンダード曲から選択 ({currentSong.title || "カスタム"})
                </button>
              </div>

              <div className="flex flex-col justify-end">
                <button
                  onClick={generateEtude}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition active:scale-[0.98] flex items-center justify-center gap-2"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21v-5h5"></path></svg>
                  エチュードを再生成
                </button>
              </div>
            </div>

            {/* 楽譜 & プレイヤーカード */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print:border-none print:shadow-none">
              <div className="bg-slate-50 border-b border-slate-200 px-4 py-3 flex flex-wrap justify-between items-center gap-3 print:hidden">
                <div className="flex items-center gap-4">
                  <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                    <input
                      type="checkbox"
                      checked={isBackingOnly}
                      onChange={(e) => setIsBackingOnly(e.target.checked)}
                      className="w-4 h-4 text-blue-600 rounded border-slate-300"
                    />
                    <span>伴奏のみ再生</span>
                  </label>
                  <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                    <input
                      type="checkbox"
                      checked={showDegrees}
                      onChange={(e) => {
                        setShowDegrees(e.target.checked);
                        generateEtude();
                      }}
                      className="w-4 h-4 text-amber-600 rounded border-slate-300"
                    />
                    <span>度数注記（音符の下）を表示</span>
                  </label>
                </div>

                <div className="flex items-center gap-3">
                  <div ref={audioRef}></div>
                  <button
                    onClick={() => window.print()}
                    className="px-3 py-1.5 text-xs bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold rounded-lg shadow-sm transition flex items-center gap-1.5"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    PDFで保存
                  </button>
                </div>
              </div>

              {/* 楽譜描画エリア */}
              <div className="p-4 md:p-8 flex justify-center bg-white overflow-x-auto custom-scrollbar">
                <div className="w-full max-w-[860px]">
                  <div id="paper" className="w-full"></div>
                  <div id="audio-paper" style={{ position: 'absolute', top: '-9999px', visibility: 'hidden' }}></div>
                </div>
              </div>
            </div>

          </div>

          {/* スタンダード曲選択モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[80vh] overflow-hidden flex flex-col">
                <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 text-sm">スタンダード曲を選択</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="p-3 overflow-y-auto custom-scrollbar space-y-1.5">
                  {standardSongs.map((song, idx) => (
                    <button
                      key={idx}
                      onClick={() => selectSong(song)}
                      className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-blue-50 hover:text-blue-700 transition flex justify-between items-center group text-xs font-semibold text-slate-700"
                    >
                      <div className="flex items-center gap-2">
                        <span>{song.title}</span>
                        <span className="text-[10px] text-slate-400 font-mono">({song.key})</span>
                      </div>
                      <span className="text-[11px] px-2 py-0.5 bg-slate-100 group-hover:bg-blue-100 text-slate-500 group-hover:text-blue-700 rounded-md">
                        {song.measures} 小節
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

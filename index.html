    // --- Music Theory Engine ---
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const GUITAR_TUNING = [64, 59, 55, 50, 45, 40]; // E4, B3, G3, D3, A2, E2 (strings 1 to 6)
    const BASS_TUNING = [43, 38, 33, 28]; // G2, D2, A1, E1 (strings 1 to 4)

    function getMidiOffset(noteStr) {
      const map = {
        'C': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
        'E': 4, 'F': 5, 'F#': 6, 'Gb': 6, 'G': 7, 'G#': 8, 'Ab': 8,
        'A': 9, 'A#': 10, 'Bb': 10, 'B': 11
      };
      return map[noteStr] || 0;
    }

    function isDominantChord(chordStr) {
      if (!chordStr) return false;
      const match = chordStr.match(/^[A-G][#b]?/);
      if (!match) return false;
      const type = chordStr.substring(match[0].length);
      return (type.includes('7') || type.includes('9') || type.includes('13') || type.includes('alt')) &&
             !type.includes('maj') && !type.includes('M7') && !type.includes('m') && !type.includes('dim');
    }

    // Dominant 7th Scale Formulas
    function getDominantApproachTones(rootMidi, strategy) {
      if (strategy === "altered") {
        // Altered: 1, b9, #9, 3, #11, b13, b7
        return [0, 1, 3, 4, 6, 8, 10].map(i => rootMidi + i);
      } else if (strategy === "condim") {
        // Half-Whole Diminished: 1, b9, #9, 3, #11, 5, 13, b7
        return [0, 1, 3, 4, 6, 7, 9, 10].map(i => rootMidi + i);
      } else {
        // Pure Chord tones + Guide tones (R, 3, 5, b7, 9, 13)
        return [0, 2, 4, 7, 10, 14, 21].map(i => rootMidi + (i % 12));
      }
    }

    function getChordTones(chordStr) {
      if (!chordStr) return [0, 4, 7, 11].map(i => 60 + i);
      const match = chordStr.match(/^[A-G][#b]?/);
      if (!match) return [0, 4, 7, 11].map(i => 60 + i);

      let root = match[0];
      let rootMidi = 60 + getMidiOffset(root);
      let type = chordStr.substring(root.length);

      let intervals = [0, 4, 7, 10]; // default dom7

      if (type.includes('maj7') || type.includes('M7') || type.includes('△7')) {
        intervals = [0, 4, 7, 11];
      } else if (type.includes('m7b5') || type.includes('h')) {
        intervals = [0, 3, 6, 10];
      } else if (type.includes('dim')) {
        intervals = [0, 3, 6, 9];
      } else if (type.includes('mM7') || type.includes('m#7')) {
        intervals = [0, 3, 7, 11];
      } else if (type.includes('m7') || type.includes('-7')) {
        intervals = [0, 3, 7, 10];
      } else if (type.includes('m') || type.includes('-')) {
        intervals = [0, 3, 7];
      } else if (type.includes('aug')) {
        intervals = [0, 4, 8];
      }

      return intervals.map(i => rootMidi + i);
    }

    // Convert MIDI pitch to ABC notation note
    function getAbcNote(midi, measureAccidentalsRef, currentChord) {
      let isFlatKey = false;
      if (currentChord) {
        const match = currentChord.match(/^[A-G][#b]?/);
        if (match) {
          const root = match[0];
          const flatRoots = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'];
          if (flatRoots.includes(root) || (currentChord.includes('m') && ['C', 'G', 'D', 'F'].includes(root))) {
            isFlatKey = true;
          }
        }
      }

      let noteNames, defaultAccidentals;
      if (isFlatKey) {
        noteNames = ['C', 'D', 'D', 'E', 'E', 'F', 'G', 'G', 'A', 'A', 'B', 'B'];
        defaultAccidentals = ['', '_', '', '_', '', '', '_', '', '_', '', '_', ''];
      } else {
        noteNames = ['C', 'C', 'D', 'D', 'E', 'F', 'F', 'G', 'G', 'A', 'A', 'B'];
        defaultAccidentals = ['', '^', '', '^', '', '', '^', '', '^', '', '^', ''];
      }

      const octave = Math.floor(midi / 12) - 1;
      const noteClass = midi % 12;
      const baseName = noteNames[noteClass];
      const targetAcc = defaultAccidentals[noteClass];

      let abcName = baseName;
      if (octave <= 3) {
        for (let k = 4; k > octave; k--) abcName += ",";
      } else if (octave === 4) {
        abcName = baseName;
      } else if (octave === 5) {
        abcName = baseName.toLowerCase();
      } else if (octave >= 6) {
        abcName = baseName.toLowerCase();
        for (let k = 5; k < octave; k++) abcName += "'";
      }

      const key = baseName + octave;
      const currentAcc = measureAccidentalsRef[key] !== undefined ? measureAccidentalsRef[key] : '';

      let prefix = "";
      if (currentAcc !== targetAcc) {
        prefix = targetAcc === '' ? '=' : targetAcc;
        measureAccidentalsRef[key] = targetAcc;
      }
      return prefix + abcName;
    }

    // Optimal TAB Finger Positioning (Guitar 6-string & Bass 4-string)
    function calculateTabFret(targetMidi, instrument = "guitar", preferredFret = 5) {
      if (instrument === "guitar") {
        let best = null;
        let minScore = 9999;
        for (let str = 0; str < 6; str++) {
          const openPitch = GUITAR_TUNING[str];
          const fret = targetMidi - openPitch;
          if (fret >= 0 && fret <= 19) {
            const dist = Math.abs(fret - preferredFret);
            const score = dist + (str * 0.7); // slight preference for higher strings
            if (score < minScore) {
              minScore = score;
              best = { string: str + 1, fret: fret };
            }
          }
        }
        return best || { string: 1, fret: 0 };
      } else if (instrument === "bass") {
        // Transpose 1 octave down (8vb, -12 semitones) strictly for TAB readability
        const bassMidi = targetMidi - 12;
        let best = null;
        let minScore = 9999;
        for (let str = 0; str < 4; str++) {
          const openPitch = BASS_TUNING[str];
          const fret = bassMidi - openPitch;
          if (fret >= 0 && fret <= 20) {
            const dist = Math.abs(fret - preferredFret);
            const score = dist + (str * 0.8);
            if (score < minScore) {
              minScore = score;
              best = { string: str + 1, fret: fret };
            }
          }
        }
        return best || { string: 1, fret: Math.max(0, bassMidi - BASS_TUNING[0]) };
      }
      return null;
    }

    // --- Main Application Component ---
    function App() {
      const [measureCount, setMeasureCount] = useState(32);
      const [bpm, setBpm] = useState(130);
      const [chords, setChords] = useState(Array(64).fill(""));
      const [currentSongTitle, setCurrentSongTitle] = useState("Autumn Leaves");
      
      // Dominant 7th Approach: 'chordTone' | 'altered' | 'condim'
      const [dominantStrategy, setDominantStrategy] = useState("altered");
      
      // View Mode: 'staff' | 'guitar' | 'bass'
      const [viewMode, setViewMode] = useState("staff");
      
      const [isBackingOnly, setIsBackingOnly] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      
      const [abcString, setAbcString] = useState("");
      const [audioAbcString, setAudioAbcString] = useState("");
      const [backingAbcString, setBackingAbcString] = useState("");
      const [parsedSoloEvents, setParsedSoloEvents] = useState([]);
      const [activeStepIndex, setActiveStepIndex] = useState(null);

      const audioRef = useRef(null);
      const synthRef = useRef(null);

      // Initialize with Autumn Leaves
      useEffect(() => {
        const autumn = STANDARD_SONGS.find(s => s.title === "Autumn Leaves");
        if (autumn) {
          selectStandardSong(autumn);
        }
      }, []);

      // Load ABCJS audio and basic renderer
      const [abcjsReady, setAbcjsReady] = useState(false);
      useEffect(() => {
        if (window.ABCJS) {
          setAbcjsReady(true);
          return;
        }
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js";
        script.async = true;
        script.onload = () => setAbcjsReady(true);
        document.body.appendChild(script);
      }, []);

      // Generate Solo Etude
      const generateSolo = (customChords = chords, customMeasures = measureCount, customDom = dominantStrategy) => {
        let flatChords = [];
        for (let i = 0; i < customMeasures; i++) {
          let chordStr = customChords[i] || "Cmaj7";
          let list = chordStr.split(/\s+/).filter(c => c.length > 0);
          if (list.length === 0) list = ["Cmaj7"];

          for (let beat = 0; beat < 4; beat++) {
            let chord = list.length === 1 ? list[0] : (beat < 2 ? list[0] : (list[1] || list[0]));
            let isDom = isDominantChord(chord);
            flatChords.push({ measure: i, beat: beat, chord: chord, isDom: isDom });
          }
        }

        const events = [];
        let currentMidi = 65; // F4 anchor

        // Generate tasteful jazz phrases beat by beat
        for (let m = 0; m < customMeasures; m++) {
          const isEndingMeasure = (m === customMeasures - 1);

          for (let beat = 0; beat < 4; beat++) {
            const currentChordObj = flatChords[m * 4 + beat];
            const chord = currentChordObj.chord;
            const isDom = currentChordObj.isDom;
            const rootMatch = chord.match(/^[A-G][#b]?/);
            const rootStr = rootMatch ? rootMatch[0] : "C";
            const rootMidi = 60 + getMidiOffset(rootStr);
            
            const chordTones = isDom 
              ? getDominantApproachTones(rootMidi, customDom) 
              : getChordTones(chord);

            const guideTones = chord.includes('m') && !chord.includes('maj') 
              ? [rootMidi + 3, rootMidi + 10] 
              : [rootMidi + 4, rootMidi + (chord.includes('maj') ? 11 : 10)];

            function getNearest(tones, target) {
              let candidates = [];
              tones.forEach(t => {
                for (let oct = -2; oct <= 2; oct++) {
                  candidates.push(t + oct * 12);
                }
              });
              candidates = candidates.filter(n => n >= 55 && n <= 82);
              if (candidates.length === 0) return 65;
              candidates.sort((a, b) => Math.abs(a - target) - Math.abs(b - target));
              return candidates[0];
            }

            // Rhythm dice: Triplet, 2-eighths, Quarter note, or tasteful rest
            const rand = Math.random();

            if (isEndingMeasure && beat >= 2) {
              // Final chord tonic resolution
              if (beat === 2) {
                events.push({
                  type: 'quarter',
                  midi: getNearest([rootMidi], currentMidi),
                  chord: chord,
                  measure: m,
                  beat: beat,
                  isTarget: true
                });
              }
              continue;
            }

            // 1. Triplets (Authentic Jazz Bebop Triplet Ornament)
            if (rand < 0.22 && beat !== 3) {
              const targetLanding = getNearest(guideTones, currentMidi);
              const dir = targetLanding >= currentMidi ? 1 : -1;
              const n1 = currentMidi;
              const n2 = currentMidi + dir;
              const n3 = targetLanding;
              currentMidi = n3;

              events.push({
                type: 'triplet',
                notes: [n1, n2, n3],
                chord: chord,
                measure: m,
                beat: beat,
                isDom: isDom
              });
            }
            // 2. Tasteful breath / rest on weak beats
            else if (rand > 0.88 && (beat === 1 || beat === 3)) {
              events.push({
                type: 'rest',
                chord: chord,
                measure: m,
                beat: beat
              });
            }
            // 3. Regular 8th-note pair with Target tone & Chromatic Enclosure
            else {
              let n1, n2;
              const isStrongBeat = (beat === 0 || beat === 2);

              if (isStrongBeat) {
                // Land firmly on 3rd, 7th, or rich tension
                n1 = getNearest(guideTones, currentMidi);
                // 2nd eighth is an approach note or chord tone step
                n2 = Math.random() < 0.5 ? n1 + (Math.random() < 0.5 ? 1 : -1) : getNearest(chordTones, n1 + 2);
              } else {
                // Chromatic enclosure or scalar step into next beat
                n1 = currentMidi + (Math.random() < 0.5 ? 1 : -1);
                n2 = getNearest(chordTones, n1);
              }

              // Keep within guitar/saxophone core jazz range
              if (n1 < 55) n1 += 12; if (n1 > 82) n1 -= 12;
              if (n2 < 55) n2 += 12; if (n2 > 82) n2 -= 12;
              currentMidi = n2;

              events.push({
                type: 'eighths',
                notes: [n1, n2],
                chord: chord,
                measure: m,
                beat: beat,
                isDom: isDom
              });
            }
          }
        }

        setParsedSoloEvents(events);

        // Build ABC Strings
        buildAbcScore(events, customMeasures, customChords);
      };

      // Build Clean ABC Notation with Beams, Triplets, and Backing tracks
      const buildAbcScore = (events, totalMeasures, currentChords) => {
        let displayHeader = "X: 1\n";
        displayHeader += "T: " + currentSongTitle + " (Jazz Solo Etude)\n";
        displayHeader += "M: 4/4\n";
        displayHeader += "L: 1/8\n";
        displayHeader += "K: C\n";
        displayHeader += "%%staffwidth 800\n";
        displayHeader += "%%stretchlast 1\n";

        let audioHeader = "X: 1\n";
        audioHeader += "T: " + currentSongTitle + "\n";
        audioHeader += "M: 4/4\n";
        audioHeader += "L: 1/8\n";
        audioHeader += `Q: 1/4=${bpm}\n`;
        audioHeader += "K: C\n";
        audioHeader += "%%stretchlast 1\n";
        audioHeader += "%%staves (1 2 3)\n";
        audioHeader += "V: 1 clef=treble\n%%MIDI program 0\n%%MIDI control 7 127\n";
        audioHeader += "V: 2 clef=treble\n%%MIDI program 4\n%%MIDI control 7 60\n";
        audioHeader += "V: 3 clef=bass\n%%MIDI program 32\n%%MIDI control 7 105\n";

        let backingHeader = "X: 1\n";
        backingHeader += "T: " + currentSongTitle + " (Backing Track)\n";
        backingHeader += "M: 4/4\n";
        backingHeader += "L: 1/8\n";
        backingHeader += `Q: 1/4=${bpm}\n`;
        backingHeader += "K: C\n";
        backingHeader += "%%stretchlast 1\n";
        backingHeader += "%%staves (1 2 3)\n";
        backingHeader += "V: 1 clef=treble\n%%MIDI program 0\n%%MIDI control 7 0\n";
        backingHeader += "V: 2 clef=treble\n%%MIDI program 4\n%%MIDI control 7 60\n";
        backingHeader += "V: 3 clef=bass\n%%MIDI program 32\n%%MIDI control 7 105\n";

        let fullMelody = "";
        let fullPiano = "";
        let fullBass = "";

        for (let m = 0; m < totalMeasures; m++) {
          let mAcc = {};
          let pianoAcc = {};
          let bassAcc = {};
          let measureMelody = "";

          const chordLine = currentChords[m] || "Cmaj7";
          const chordTokens = chordLine.split(/\s+/).filter(c => c.length > 0);
          const measureEvents = events.filter(e => e.measure === m);

          for (let b = 0; b < 4; b++) {
            if (b === 0) measureMelody += `"${chordTokens[0]}"`;
            if (b === 2 && chordTokens.length >= 2) measureMelody += `"${chordTokens[1]}"`;

            const ev = measureEvents.find(e => e.beat === b);
            if (!ev || ev.type === 'rest') {
              measureMelody += "z2 ";
            } else if (ev.type === 'triplet') {
              const [t1, t2, t3] = ev.notes;
              measureMelody += `(3${getAbcNote(t1, mAcc, ev.chord)}${getAbcNote(t2, mAcc, ev.chord)}${getAbcNote(t3, mAcc, ev.chord)} `;
            } else if (ev.type === 'quarter') {
              measureMelody += `${getAbcNote(ev.midi, mAcc, ev.chord)}2 `;
            } else if (ev.type === 'eighths') {
              const [n1, n2] = ev.notes;
              // Cleanly beamed pair
              measureMelody += `${getAbcNote(n1, mAcc, ev.chord)}${getAbcNote(n2, mAcc, ev.chord)} `;
            }
          }

          measureMelody += (m === totalMeasures - 1) ? " |]" : " | ";

          // Rhythm section backing
          const root1 = 36 + getMidiOffset((chordTokens[0] || "C").match(/^[A-G][#b]?/)[0]);
          const root2 = chordTokens[1] ? 36 + getMidiOffset(chordTokens[1].match(/^[A-G][#b]?/)[0]) : root1 + 7;

          let pianoChord1 = "[" + getChordTones(chordTokens[0]).slice(1).map(n => getAbcNote(n - 12, pianoAcc, chordTokens[0])).join("") + "]";
          let pianoMeasure = "";
          let bassMeasure = "";

          if (chordTokens.length >= 2) {
            let pianoChord2 = "[" + getChordTones(chordTokens[1]).slice(1).map(n => getAbcNote(n - 12, pianoAcc, chordTokens[1])).join("") + "]";
            pianoMeasure = `${pianoChord1}4 ${pianoChord2}4 | `;
            bassMeasure = `${getAbcNote(root1, bassAcc, chordTokens[0])}2 ${getAbcNote(root1 + 4, bassAcc, chordTokens[0])}2 ${getAbcNote(root2, bassAcc, chordTokens[1])}2 ${getAbcNote(root2 - 1, bassAcc, chordTokens[1])}2 | `;
          } else {
            pianoMeasure = `${pianoChord1}8 | `;
            bassMeasure = `${getAbcNote(root1, bassAcc, chordTokens[0])}2 ${getAbcNote(root1 + 4, bassAcc, chordTokens[0])}2 ${getAbcNote(root1 + 7, bassAcc, chordTokens[0])}2 ${getAbcNote(root1 + 10, bassAcc, chordTokens[0])}2 | `;
          }

          if (m === totalMeasures - 1) {
            pianoMeasure = pianoMeasure.replace(" | ", " |]");
            bassMeasure = bassMeasure.replace(" | ", " |]");
          }

          fullMelody += measureMelody;
          fullPiano += pianoMeasure;
          fullBass += bassMeasure;

          if ((m + 1) % 4 === 0 || m === totalMeasures - 1) {
            fullMelody += "\n";
            fullPiano += "\n";
            fullBass += "\n";
          }
        }

        setAbcString(displayHeader + fullMelody);

        let finalAudio = audioHeader;
        finalAudio += "[V: 1]\n[Q: 1/4=" + bpm + "]\n" + fullMelody;
        finalAudio += "[V: 2]\n[Q: 1/4=" + bpm + "]\n" + fullPiano;
        finalAudio += "[V: 3]\n[Q: 1/4=" + bpm + "]\n" + fullBass;
        setAudioAbcString(finalAudio);

        let finalBacking = backingHeader;
        finalBacking += "[V: 1]\n[Q: 1/4=" + bpm + "]\n" + fullMelody;
        finalBacking += "[V: 2]\n[Q: 1/4=" + bpm + "]\n" + fullPiano;
        finalBacking += "[V: 3]\n[Q: 1/4=" + bpm + "]\n" + fullBass;
        setBackingAbcString(finalBacking);
      };

      // Select Standard Song Preset
      const selectStandardSong = (song) => {
        setMeasureCount(song.measures);
        const newChords = Array(64).fill("");
        song.chords.forEach((c, i) => { newChords[i] = c; });
        setChords(newChords);
        setCurrentSongTitle(song.title);
        setIsModalOpen(false);
        generateSolo(newChords, song.measures, dominantStrategy);
      };

      // Re-render score and synth on change
      useEffect(() => {
        if (!abcjsReady || !abcString || !window.ABCJS) return;

        // Render sheet music if in staff mode
        if (viewMode === 'staff') {
          window.ABCJS.renderAbc("paper", abcString, {
            responsive: "resize",
            add_classes: true,
            paddingtop: 10,
            paddingbottom: 25,
            paddingleft: 0,

        // Setup audio synth
        const activeAudioStr = isBackingOnly ? backingAbcString : audioAbcString;
        const visualObj = window.ABCJS.renderAbc("audio-paper", activeAudioStr, { add_classes: true })[0];

        if (window.ABCJS.synth.supportsAudio() && audioRef.current) {

            synthRef.current.pause();
            synthRef.current.disable(true);
          }
          audioRef.current.innerHTML = "";

          const cursorControl = {
            onStart: () => setActiveStepIndex(null),
            onEvent: (ev) => {
              if (!ev || (ev.measureStart && ev.left === null)) return;
              if (ev.elements && Array.isArray(ev.elements)) {
                const noteElem = ev.elements[0];
                if (noteElem && noteElem.getAttribute) {
                  // Track playing position
                }
              }
            },
            onFinished: () => setActiveStepIndex(null)
          };

          const synthControl = new window.ABCJS.synth.SynthController();
          synthControl.load(audioRef.current, cursorControl, {
            displayLoop: true,
            displayRestart: true,
            displayPlay: true,
            displayProgress: true,
            displayWarp: false
          });

          synthControl.setTune(visualObj, false, { chordsOff: true }).catch(console.error);
          synthRef.current = synthControl;
        }
      }, [abcString, audioAbcString, backingAbcString, isBackingOnly, abcjsReady, viewMode]);

      // Handle strategy or BPM update
      const handleStrategyChange = (strat) => {
        setDominantStrategy(strat);
        generateSolo(chords, measureCount, strat);

      const handleBpmSlider = (val) => {
        setBpm(val);

      };

      // Custom Clean TAB View Renderer (4 measures per line)
      const renderTabScore = (instrument) => {
        const isBass = instrument === "bass";
        const stringsCount = isBass ? 4 : 6;
        const stringNames = isBass ? ["G", "D", "A", "E"] : ["E", "B", "G", "D", "A", "E"];
        const measuresPerRow = 4;
        const rowsCount = Math.ceil(measureCount / measuresPerRow);

        const rows = [];
        for (let r = 0; r < rowsCount; r++) {
          const rowMeasures = [];
          for (let m = 0; m < measuresPerRow; m++) {
            const mIdx = r * measuresPerRow + m;
            if (mIdx < measureCount) {
              rowMeasures.push(mIdx);
            }
          }
          rows.push(rowMeasures);
        }

        return (
          <div className="space-y-6 w-full max-w-4xl mx-auto py-2">
            <div className="flex items-center justify-between border-b pb-2 mb-4 text-xs font-semibold text-slate-500">
              <span className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <span>{isBass ? "4-String Bass TAB" : "6-String Guitar TAB"}</span>
              </span>
              {isBass && (
                <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-mono text-[11px] font-bold">
                  8vb (実音ピッチそのまま / TABのみ1オクターブ下げて最適化)
                </span>
              )}
            </div>

            {rows.map((row, rIdx) => (
              <div key={rIdx} className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm overflow-x-auto custom-scrollbar">
                <div className="grid grid-cols-4 gap-2 min-w-[720px]">
                  {row.map(mIdx => {
                    const measureEvents = parsedSoloEvents.filter(e => e.measure === mIdx);
                    const chordText = chords[mIdx] || "Cmaj7";

                    return (
                      <div key={mIdx} className="border-r last:border-r-0 border-slate-300 pr-2 relative">
                        {/* Measure Header & Chord */}
                        <div className="flex justify-between items-center mb-1.5 px-1">
                          <span className="text-[10px] font-mono text-slate-400">m.{mIdx + 1}</span>
                          <span className={`text-xs font-bold font-mono px-1.5 py-0.5 rounded ${
                            isDominantChord(chordText) 
                              ? 'bg-amber-100 text-amber-900 border border-amber-300' 
                              : 'text-slate-800'
                          }`}>
                            {chordText}
                          </span>
                        </div>

                        {/* TAB Staff SVG */}
                        <svg viewBox={`0 0 170 ${stringsCount * 14 + 10}`} className="w-full h-auto">
                          {/* TAB Lines */}
                          {Array.from({ length: stringsCount }).map((_, s) => (
                            <line 
                              key={s} 
                              x1="0" 
                              y1={10 + s * 14} 
                              x2="170" 
                              y2={10 + s * 14} 
                              stroke="#94a3b8" 
                              strokeWidth="1" 
                            />
                          ))}

                          {/* Event Notes */}
                          {measureEvents.map((ev, evIdx) => {
                            const beatX = 18 + (ev.beat * 38);

                            if (ev.type === 'rest') {
                              return (
                                <text key={evIdx} x={beatX + 10} y={stringsCount * 7 + 10} textAnchor="middle" fontSize="11" fill="#94a3b8" fontStyle="italic">
                                  —
                                </text>
                              );
                            } else if (ev.type === 'triplet') {
                              return (
                                <g key={evIdx}>
                                  <text x={beatX + 16} y="6" textAnchor="middle" fontSize="8" fill="#64748b" fontWeight="bold">3</text>
                                  {ev.notes.map((n, ni) => {
                                    const tab = calculateTabFret(n, instrument);
                                    if (!tab) return null;
                                    const y = 10 + (tab.string - 1) * 14;
                                    const x = beatX + (ni * 12);
                                    return (
                                      <g key={ni}>
                                        <rect x={x - 4} y={y - 6} width="8" height="11" fill="#ffffff" />
                                        <text x={x} y={y + 3.5} textAnchor="middle" fontSize="10" fontWeight="bold" fill={ev.isDom ? "#d97706" : "#2563eb"}>
                                          {tab.fret}
                                        </text>
                                      </g>
                                    );
                                  })}
                                </g>
                              );
                            } else if (ev.type === 'quarter') {
                              const tab = calculateTabFret(ev.midi, instrument);
                              if (!tab) return null;
                              const y = 10 + (tab.string - 1) * 14;
                              return (
                                <g key={evIdx}>
                                  <rect x={beatX + 6} y={y - 6} width="10" height="11" fill="#ffffff" />
                                  <text x={beatX + 11} y={y + 3.5} textAnchor="middle" fontSize="11" fontWeight="bold" fill="#0f172a">
                                    {tab.fret}
                                  </text>
                                </g>
                              );
                            } else if (ev.type === 'eighths') {
                              return (
                                <g key={evIdx}>
                                  {ev.notes.map((n, ni) => {
                                    const tab = calculateTabFret(n, instrument);
                                    if (!tab) return null;
                                    const y = 10 + (tab.string - 1) * 14;
                                    const x = beatX + (ni * 16) + 4;
                                    return (
                                      <g key={ni}>
                                        <rect x={x - 4.5} y={y - 6} width="9" height="11" fill="#ffffff" />
                                        <text x={x} y={y + 3.5} textAnchor="middle" fontSize="10.5" fontWeight="bold" fill={ev.isDom ? "#d97706" : "#1e293b"}>
                                          {tab.fret}
                                        </text>
                                      </g>
                                    );
                                  })}
                                </g>
                              );
                            }
                            return null;
                          })}
                        </svg>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        );
      };

      return (

                  <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                  </svg>
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 font-display flex items-center gap-2">

                  </h1>
                  <p className="text-xs text-slate-500">コードトーン &amp; ドミナント7thアプローチ・エチュードジェネレーター</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold text-xs sm:text-sm rounded-xl border border-blue-200 transition shadow-sm flex items-center gap-1.5"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
                  <span>曲を選ぶ ({currentSongTitle})</span>
                </button>

                <button

                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

                    <button

                      コードトーン

                </div>

                {/* 3. Tempo (BPM) & Playback Options */}
                <div>
                  <div className="flex items-center justify-between mb-1.5">

                  <input

                  <div className="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

                <div className="flex items-center gap-3">
                  <span className="text-sm font-bold text-slate-800 font-display">

                  <span className="text-xs px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono font-semibold">
                    {measureCount} 小節
                  </span>
                  <span className={`text-[11px] px-2 py-0.5 rounded font-mono font-semibold ${

                    className="text-xs flex items-center gap-1 bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 px-3 py-1.5 rounded-lg shadow-sm transition font-medium"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    <span>印刷 / PDF</span>
                  </button>
                </div>
              </div>

              {/* Synthesizer Player Mount */}
              <div className="bg-white border-b border-slate-100 p-3 flex justify-center print:hidden">
                <div ref={audioRef} className="w-full max-w-xl"></div>
              </div>

              {/* View Output (Staff or Guitar TAB or Bass TAB) */}
              <div className="p-4 sm:p-8 flex justify-center w-full min-h-[420px] overflow-x-auto custom-scrollbar">
                {viewMode === 'staff' ? (
                  <div className="w-full max-w-[850px]">
                    <div id="paper" className="w-full"></div>
                    <div id="audio-paper" style={{ position: 'absolute', top: '-9999px', visibility: 'hidden' }}></div>
                  </div>
                ) : (
                  renderTabScore(viewMode)
                )}
              </div>
            </div>

            {/* Chord Progression Grid Accordion / Editor */}
            <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 print:hidden space-y-3">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-sm font-bold text-slate-800">コード進行チャート</span>
                  <p className="text-xs text-slate-500">セルを直接クリックしてコードを自由に変更・調整できます。</p>
                </div>
                <button
                  onClick={() => generateSolo(chords, measureCount, dominantStrategy)}
                  className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 transition font-medium"
                >
                  この進行でエチュードを更新
                </button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                {Array.from({ length: measureCount }).map((_, i) => (
                  <div key={i} className="flex flex-col">
                    <span className="text-[10px] text-slate-400 font-mono pl-1">{i + 1}</span>
                    <input
                      type="text"
                      value={chords[i] || ""}
                      onChange={(e) => {
                        const newC = [...chords];
                        newC[i] = e.target.value;
                        setChords(newC);
                      }}
                      placeholder="Cmaj7"
                      className="border border-slate-200 p-1.5 rounded-lg text-xs font-mono font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-inner bg-slate-50"
                    />
                  </div>
                ))}
              </div>
            </div>

          </div>

          {/* Standard Song Selection Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col border border-slate-200 animate-[fadeIn_0.15s_ease-out]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h2 className="font-bold text-slate-800 flex items-center gap-2">
                    <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                    スタンダード曲を選択（フルサイズ）
                  </h2>
                  <button 
                    onClick={() => setIsModalOpen(false)} 
                    className="text-slate-400 hover:text-slate-600 bg-white p-1 rounded-full border border-slate-200 transition"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
                <div className="p-4 overflow-y-auto custom-scrollbar flex-1 space-y-2">
                  {STANDARD_SONGS.map((song, idx) => (
                    <button
                      key={idx}
                      onClick={() => selectStandardSong(song)}
                      className="w-full text-left px-4 py-3 rounded-xl hover:bg-blue-50 border border-slate-100 hover:border-blue-200 transition flex justify-between items-center group bg-white shadow-sm"
                    >
                      <div>
                        <div className="font-semibold text-slate-800 group-hover:text-blue-700 transition">{song.title}</div>
                        <div className="text-[11px] text-slate-400 font-mono">Key: {song.key}</div>
                      </div>
                      <span className="text-xs text-slate-500 bg-slate-100 group-hover:bg-white group-hover:text-blue-600 px-2.5 py-1 rounded-md transition border border-slate-200">
                        {song.measures} 小節
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          <footer className="max-w-6xl mx-auto mt-8 text-center text-xs text-slate-400 border-t border-slate-200 pt-4 print:hidden">
            Jazz Standard Solo Trainer &bull; Complete Full Tunes &amp; Beamed Bebop Etude Generator
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
